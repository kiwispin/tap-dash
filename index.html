<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tournament Dash: School Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050510;
            --text-main: #fff;
            --cyan: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.3);
            --cyan-glow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            --pink: #ff00cc;
            --yellow: #fff01f;
            --orange: #ffaa00;
            --green: #39ff14;
            --blue: #00f3ff;
            --white: #ffffff;
            --purple: #9d00ff;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none; /* kills iOS rubber-band bounce */
            background-color: var(--bg-color);
            color: var(--text-main);
            touch-action: manipulation;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image:
                linear-gradient(rgba(0,243,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }
        .grid-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(5,5,16,0.85) 100%);
        }

        .hidden { display: none !important; }

        .screen {
            /* dvh = dynamic viewport height — accounts for iOS browser chrome.
               Falls back to 100vh on browsers that don't support dvh. */
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
        }

        /* ── Portrait lock (player iPads) ───────────────────────────────────────
           Players use iPads locked to portrait. Portrait iPad = ~768×1024 minus
           browser chrome ≈ 900px usable height. Plenty of room — just scale
           elements sensibly so nothing is comically oversized on a tablet.
           The watching screen (desktop landscape) never hits this query.
        ─────────────────────────────────────────────────────────────────────── */
        @media (orientation: portrait) {

            /* Setup screen */
            #setup h1 { font-size: clamp(1.6rem, 5vw, 2.8rem); letter-spacing: 8px; margin-bottom: 30px; }
            .btn-grid { gap: 14px; }
            .btn-grid button { height: clamp(65px, 9vh, 100px); font-size: clamp(0.9rem, 2.5vw, 1.3rem); }
            .btn-duel { margin-top: 16px; }

            /* Client tap screen */
            #tap-btn, #practice-btn {
                width: 60vw; height: 60vw;
                max-width: 320px; max-height: 320px;
            }
            #msg { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: 35px; }

            /* Duel lobby */
            .duel-lobby { gap: 14px; max-width: 90vw; }

            /* Duel arena — portrait has lots of height, size off vw (the narrow axis) */
            #duel-arena { padding: 60px 24px 24px; }

            .duel-round-header { margin-bottom: 8px; }
            .duel-round-label  { font-size: 0.75rem; letter-spacing: 5px; }
            .duel-round-stars  { gap: 30px; margin-top: 8px; }
            .duel-star-name    { font-size: 1rem; letter-spacing: 3px; }
            .duel-star         { font-size: 1.4rem; }

            /* Timer: big and proud in portrait */
            .duel-timer { font-size: clamp(5rem, 22vw, 10rem); margin: 12px 0; }

            /* Lanes */
            .duel-lanes { gap: 16px; margin: 10px 0; max-width: 100%; }
            .duel-lane  { gap: 6px; }
            .duel-lane-name  { font-size: clamp(1rem, 3.5vw, 1.4rem); letter-spacing: 3px; }
            .duel-lane-score { font-size: clamp(1.3rem, 4vw, 1.8rem); }
            .duel-track { height: clamp(20px, 3.5vw, 36px); }

            /* Tap button: sized off vw in portrait */
            .duel-tap-zone {
                width:  clamp(120px, 38vw, 220px);
                height: clamp(120px, 38vw, 220px);
                font-size: clamp(1.1rem, 4vw, 1.6rem);
                margin-top: 16px;
            }
        }

        button {
            cursor: pointer;
            transition: all 0.2s ease-out;
            font-family: 'Orbitron', sans-serif;
        }

        /* ===== SETUP SCREEN ===== */
        #setup h1 {
            font-size: clamp(2rem, 5vw, 4.5rem);
            text-transform: uppercase;
            letter-spacing: 12px;
            text-shadow: 0 0 40px var(--blue), 0 0 80px rgba(0,243,255,0.3);
            margin-bottom: 50px;
            text-align: center;
            font-weight: 900;
        }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            padding: 0 20px;
        }

        .btn-grid button {
            position: relative;
            flex: 1 1 220px;
            max-width: 320px;
            height: clamp(80px, 10vh, 120px);
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: clamp(1rem, 2vw, 1.6rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 92% 100%, 0 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-grid button:hover { transform: translateY(-6px) scale(1.03); z-index: 10; }
        .btn-grid button.disabled-team { opacity: 0.15; pointer-events: none; filter: grayscale(1); }

        .btn-aranui   { border-color: var(--pink)  !important; background: rgba(255,0,204,0.15)   !important; box-shadow: 0 0 20px rgba(255,0,204,0.15),   inset 0 0 30px rgba(255,0,204,0.08)   !important; }
        .btn-tainui   { border-color: var(--yellow) !important; background: rgba(255,240,31,0.15)  !important; box-shadow: 0 0 20px rgba(255,240,31,0.15),  inset 0 0 30px rgba(255,240,31,0.08)  !important; color:#fff; }
        .btn-mahitahi { border-color: var(--orange) !important; background: rgba(255,170,0,0.15)   !important; box-shadow: 0 0 20px rgba(255,170,0,0.15),   inset 0 0 30px rgba(255,170,0,0.08)   !important; }
        .btn-kiakaha  { border-color: var(--green)  !important; background: rgba(57,255,20,0.15)   !important; box-shadow: 0 0 20px rgba(57,255,20,0.15),   inset 0 0 30px rgba(57,255,20,0.08)   !important; }
        .btn-tearoha  { border-color: var(--blue)   !important; background: rgba(0,243,255,0.15)   !important; box-shadow: 0 0 20px rgba(0,243,255,0.15),   inset 0 0 30px rgba(0,243,255,0.08)   !important; }
        .btn-year9    { border-color: var(--white)  !important; background: rgba(255,255,255,0.15) !important; box-shadow: 0 0 20px rgba(255,255,255,0.15), inset 0 0 30px rgba(255,255,255,0.08) !important; }
        .btn-staff    { border-color: var(--purple) !important; background: rgba(157,0,255,0.15)   !important; box-shadow: 0 0 20px rgba(157,0,255,0.15),   inset 0 0 30px rgba(157,0,255,0.08)   !important; }

        .btn-aranui:hover   { background: var(--pink)  !important; box-shadow: 0 0 50px var(--pink)  !important; }
        .btn-tainui:hover   { background: var(--yellow)!important; color:#000; box-shadow: 0 0 50px var(--yellow)!important; }
        .btn-mahitahi:hover { background: var(--orange)!important; box-shadow: 0 0 50px var(--orange)!important; }
        .btn-kiakaha:hover  { background: var(--green) !important; color:#000; box-shadow: 0 0 50px var(--green) !important; }
        .btn-tearoha:hover  { background: var(--blue)  !important; color:#000; box-shadow: 0 0 50px var(--blue)  !important; }
        .btn-year9:hover    { background: var(--white) !important; color:#000; box-shadow: 0 0 50px var(--white) !important; }
        .btn-staff:hover    { background: var(--purple)!important; box-shadow: 0 0 50px var(--purple)!important; }

        .btn-host {
            width: 100%; max-width: 300px;
            margin-top: 50px; height: 50px;
            background: rgba(255,255,255,0.05);
            color: #666; border: 1px solid #333;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            font-weight: 700; letter-spacing: 3px; font-size: 0.85rem;
        }
        .btn-host:hover { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: translateY(-2px); border-color: #fff; }

        .btn-bracket-corner {
            position: absolute; top: 30px; right: 30px;
            padding: 12px 30px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--blue); color: var(--blue);
            font-weight: 700; letter-spacing: 3px; font-size: 0.85rem;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            box-shadow: 0 0 15px rgba(0,243,255,0.15);
            backdrop-filter: blur(4px); z-index: 100;
        }
        .btn-bracket-corner:hover { background: var(--blue); color: #000; box-shadow: 0 0 30px var(--blue); }

        .btn-duel {
            width: 100%; max-width: 350px; margin-top: 20px; height: 55px;
            background: linear-gradient(135deg, rgba(157,0,255,0.2), rgba(255,0,204,0.2));
            color: var(--purple); border: 1px solid var(--purple);
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            font-weight: 700; letter-spacing: 3px; font-size: 0.95rem;
            box-shadow: 0 0 20px rgba(157,0,255,0.15);
        }
        .btn-duel:hover { background: linear-gradient(135deg, var(--purple), var(--pink)); color:#fff; box-shadow: 0 0 40px var(--purple); transform: translateY(-2px); }

        /* ===== BRACKET ===== */
        #bracket-screen {
            background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
            padding: 20px; overflow: hidden;
        }
        .bracket-header {
            font-size: clamp(1.5rem, 4vw, 3rem);
            letter-spacing: 10px; color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan);
            text-align: center; width: 100%; margin-top: 20px; margin-bottom: 10px;
        }
        .bracket-wrapper {
            display: flex; justify-content: space-around; align-items: stretch;
            width: 100%; max-width: 1500px; height: 68vh; margin-top: 10px;
        }
        .round { display: flex; flex-direction: column; justify-content: space-around; flex: 1; padding: 0 15px; }
        .round-final { justify-content: center; }
        .match-group { display: flex; flex-direction: column; justify-content: center; position: relative; margin: 8px 0; padding: 8px 0; }
        .match {
            background: rgba(0,10,20,0.8); border: 1px solid #333;
            border-left: 3px solid var(--cyan); padding: 12px;
            clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
            display: flex; flex-direction: column; gap: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .match:hover { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0,243,255,0.12); background: rgba(0,20,40,0.8); }
        .bracket-input {
            background: transparent; border: none; border-bottom: 1px solid #333;
            color: #fff; font-family: 'Orbitron'; font-size: 0.85rem;
            text-align: center; width: 100%; padding: 5px 0; outline: none;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .bracket-input:focus { border-bottom-color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
        .bracket-input::placeholder { color: #444; font-size: 0.65rem; letter-spacing: 2px; }
        .connector-right { position: absolute; right: -16px; top: 50%; width: 16px; height: 2px; background: var(--cyan); box-shadow: 0 0 5px var(--cyan); z-index: 10; }
        .connector-left  { position: absolute; left: -16px; top: 50%; width: 16px; height: 2px; background: var(--cyan); box-shadow: 0 0 5px var(--cyan); z-index: 10; }
        .two-into-one { display: flex; align-items: center; justify-content: center; }
        .round-semi .match-group::before, .round-finals .match-group::before {
            content: ''; position: absolute; left: -16px; top: 25%; bottom: 25%;
            width: 2px; background: var(--cyan); box-shadow: 0 0 5px var(--cyan);
        }
        .match.final-match { border: 2px solid var(--gold); padding: 20px; box-shadow: 0 0 30px rgba(255,215,0,0.15); transform: scale(1.05); }
        .final-label { color: var(--gold); font-size: 0.7rem; letter-spacing: 4px; text-align: center; margin-bottom: 5px; opacity: 0.8; }
        .bracket-input.champion { font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 10px var(--gold); border-bottom: none; }
        .bracket-controls { margin-top: auto; display: flex; gap: 20px; margin-bottom: 25px; }

        /* ===== HOST SCREEN — BIG SCREEN OVERHAUL ===== */
        #host {
            background: radial-gradient(circle at center, #0d0d1a 0%, #000 100%);
            padding: 0; justify-content: flex-start; overflow: hidden;
        }

        /* Top HUD Bar */
        .host-hud-bar {
            width: 100%; height: 90px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px;
            background: rgba(0,0,0,0.7);
            border-bottom: 1px solid rgba(0,243,255,0.2);
            backdrop-filter: blur(10px);
            flex-shrink: 0; z-index: 10;
        }

        .hud-live-badge {
            background: #e60000;
            color: #fff; font-weight: 900;
            padding: 8px 20px; font-size: 1rem;
            letter-spacing: 4px;
            transform: skewX(-8deg);
            box-shadow: 0 0 20px rgba(230,0,0,0.6);
        }

        #timer-display {
            font-size: clamp(5rem, 10vw, 10rem);
            font-weight: 900; line-height: 1;
            color: #fff;
            text-shadow: 0 0 40px rgba(255,255,255,0.6);
            font-variant-numeric: tabular-nums;
        }

        #race-lights {
            display: flex; gap: 16px;
            background: rgba(0,0,0,0.8); padding: 12px 25px;
            border: 1px solid #333; border-radius: 50px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .light { width: 28px; height: 28px; border-radius: 50%; background: #1a1a1a; border: 2px solid #333; transition: all 0.05s; }
        .light.active { background: #ff0000; box-shadow: 0 0 25px #ff0000; border-color: #fff; }
        #race-lights.go-signal .light { background: #00ff00 !important; box-shadow: 0 0 50px #00ff00 !important; border-color: #fff; transform: scale(1.1); }

        /* Match Setup Panel */
        #match-setup {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid #222;
            padding: 8px 30px;
            display: flex; gap: 20px; font-size: 0.75rem;
            justify-content: center; flex-wrap: wrap; align-items: center;
            flex-shrink: 0;
        }
        .setup-checkbox { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #888; font-weight: bold; letter-spacing: 1px; }
        .setup-checkbox:hover { color: #fff; }
        .setup-checkbox input { accent-color: var(--blue); width: 1.1em; height: 1.1em; }

        /* SCOREBOARD — the main event */
        #scoreboard {
            flex: 1; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center;
            gap: 0;
            padding: 20px 60px;
            position: relative; overflow: hidden;
        }

        .vs-watermark {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            font-size: 40vw; line-height: 0.8; font-weight: 900; font-style: italic;
            color: rgba(255,255,255,0.02);
            pointer-events: none; z-index: 0; user-select: none;
        }

        body.immersive #match-setup,
        body.immersive #controls,
        body.immersive .immersive-hint { display: none !important; }
        body.immersive { cursor: none; }

        .lane {
            display: grid;
            grid-template-columns: 280px 1fr 100px;
            align-items: center;
            gap: 20px;
            padding: 10px 0;
            position: relative; z-index: 1;
            transition: opacity 0.3s;
        }
        .lane.inactive { display: none; }

        .lane-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .lane-label {
            font-weight: 900;
            font-size: clamp(1.4rem, 3vw, 2.8rem);
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .win-dots { display: flex; gap: 6px; margin-top: 2px; }
        .dot { width: clamp(14px,1.5vw,22px); height: clamp(14px,1.5vw,22px); border-radius: 50%; background: #1a1a1a; border: 2px solid #444; transition: all 0.3s; }
        .dot.active { background: #fff; box-shadow: 0 0 12px #fff, 0 0 25px rgba(255,255,255,0.5); border-color: #fff; }

        .track {
            width: 100%; height: clamp(30px, 4vh, 55px);
            background: rgba(255,255,255,0.04);
            border-radius: 4px; position: relative; overflow: visible;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .bar {
            height: 100%; width: 0%;
            transition: width 0.3s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            position: relative; border-radius: 3px;
            box-shadow: 0 0 20px currentColor;
        }
        .bar::after {
            content: ''; position: absolute;
            top: -8px; right: -12px;
            width: clamp(20px,2vw,35px); height: calc(100% + 16px);
            background: rgba(255,255,255,0.9);
            border-radius: 4px;
            box-shadow: 0 0 15px #fff, 0 0 50px currentColor;
            transform: skewX(-20deg);
        }

        .score-text {
            font-size: clamp(1.8rem, 3vw, 3.5rem);
            font-weight: 900; color: #fff; text-align: center;
            text-shadow: 0 0 15px currentColor;
            font-variant-numeric: tabular-nums;
        }

        /* Team bar colors */
        .bg-aranui   { background: linear-gradient(90deg, rgba(255,0,204,0.5),  var(--pink));   color: var(--pink);   }
        .bg-tainui   { background: linear-gradient(90deg, rgba(255,240,31,0.5), var(--yellow)); color: var(--yellow); }
        .bg-mahitahi { background: linear-gradient(90deg, rgba(255,170,0,0.5),  var(--orange)); color: var(--orange); }
        .bg-kiakaha  { background: linear-gradient(90deg, rgba(57,255,20,0.5),  var(--green));  color: var(--green);  }
        .bg-tearoha  { background: linear-gradient(90deg, rgba(0,243,255,0.5),  var(--blue));   color: var(--blue);   }
        .bg-year9    { background: linear-gradient(90deg, rgba(200,200,200,0.5),var(--white));  color: var(--white);  }
        .bg-staff    { background: linear-gradient(90deg, rgba(157,0,255,0.5),  var(--purple)); color: var(--purple); }

        /* CONTROLS */
        #controls {
            height: 70px; display: flex; gap: 15px;
            align-items: center; justify-content: center; width: 100%;
            background: rgba(0,0,0,0.9); padding: 0 30px;
            border-top: 1px solid #222; flex-shrink: 0;
        }
        .status-badge, .control-btn {
            height: 44px; display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase; border-radius: 3px; box-sizing: border-box;
        }
        .status-badge { background: #0a0a0a; color: #444; border: 1px solid #222; min-width: 180px; padding: 0 20px; }
        .status-badge.active { background: rgba(57,255,20,0.08); color: var(--green); border-color: var(--green); box-shadow: 0 0 15px rgba(57,255,20,0.15); text-shadow: 0 0 5px var(--green); }
        .control-btn { background: transparent; color: #666; border: 1px solid #333; padding: 0 25px; cursor: pointer; min-width: 180px; font-family: 'Orbitron'; transition: all 0.2s; }
        .control-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }
        .control-btn.primary { border-color: var(--blue); color: var(--blue); box-shadow: inset 0 0 10px rgba(0,243,255,0.08); }
        .control-btn.primary:hover { background: var(--blue); color: #000; box-shadow: 0 0 25px var(--blue); }
        .control-btn.danger { border-color: var(--pink); color: var(--pink); opacity: 0.7; }
        .control-btn.danger:hover { opacity: 1; background: var(--pink); color: #fff; box-shadow: 0 0 25px var(--pink); }
        .control-btn.exit { border-color: var(--orange); color: var(--orange); margin-left: auto; }
        .control-btn.exit:hover { background: var(--orange); color: #000; box-shadow: 0 0 25px var(--orange); }

        /* WINNER OVERLAY */
        #winner-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); animation: fadeIn 0.5s ease-out;
        }
        .trophy-container { width: 200px; height: 200px; margin-bottom: 30px; filter: drop-shadow(0 0 30px currentColor); animation: float 2s infinite ease-in-out; }
        .winner-title { font-size: clamp(1.5rem, 3vw, 3rem); color: #fff; text-shadow: 0 0 10px #fff; margin: 0; letter-spacing: 6px; }
        .winner-name { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; text-transform: uppercase; text-shadow: 0 0 40px currentColor, 0 0 80px currentColor; margin: 15px 0 50px 0; letter-spacing: 5px; }
        .winner-close-btn { background: transparent; color: #fff; border: 2px solid #fff; padding: 18px 50px; font-family: 'Orbitron'; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 4px; }
        .winner-close-btn:hover { background: #fff; color: #000; box-shadow: 0 0 40px #fff; }

        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

        /* ===== CLIENT SCREEN ===== */
        #client {
            text-align: center; position: relative;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
        }
        #tap-btn, #practice-btn {
            width: 70vw; height: 70vw; max-width: 420px; max-height: 420px;
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5); color: white; font-size: 3.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.8);
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            position: relative; z-index: 2;
        }
        #tap-btn::after, #practice-btn::after {
            content: ''; position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border-radius: 50%; border: 4px solid currentColor;
            opacity: 0.5; box-shadow: 0 0 25px currentColor; animation: pulse 2s infinite;
        }
        #tap-btn:active, #practice-btn:active { transform: scale(0.94); }
        #client.locked #tap-btn { display: none; }
        #client:not(.locked) #practice-btn { display: none; }
        #msg { font-size: clamp(2rem, 6vw, 4rem); margin-bottom: 50px; font-weight: 900; text-transform: uppercase; letter-spacing: 8px; text-shadow: 0 0 25px currentColor; z-index: 2; }
        .tps-counter { font-family: 'Orbitron'; color: #555; font-size: 1.4rem; margin: 25px 0; letter-spacing: 3px; }
        .btn-client-exit {
            position: absolute; top: 30px; left: 30px; padding: 12px 28px;
            background: rgba(0,0,0,0.6); border: 1px solid var(--orange); color: var(--orange);
            font-weight: 700; letter-spacing: 2px; font-size: 0.85rem;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            backdrop-filter: blur(4px); z-index: 100;
        }
        .btn-client-exit:hover { background: var(--orange); color: #000; box-shadow: 0 0 30px var(--orange); }
        #client:not(.locked) .btn-client-exit { display: none; }

        @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.02); opacity: 0.8; } }

        /* ===== PIN MODAL ===== */
        #pin-modal, #confirm-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; backdrop-filter: blur(10px);
        }
        .pin-box {
            background: #050510; border: 2px solid var(--cyan);
            box-shadow: 0 0 25px rgba(0,243,255,0.25), inset 0 0 40px rgba(0,243,255,0.08);
            padding: 50px; width: 350px; text-align: center;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100%-20px), calc(100%-20px) 100%, 0 100%, 0 20px);
            position: relative;
        }
        .pin-box::before { content: 'SECURITY CHECK'; position: absolute; top: 14px; left: 0; right: 0; font-size: 0.75rem; letter-spacing: 5px; color: var(--cyan); opacity: 0.6; }
        .pin-display {
            background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff;
            font-family: 'Orbitron'; font-size: 2.5rem; letter-spacing: 10px;
            margin: 35px 0; padding: 12px; width: 100%; text-align: center; outline: none;
        }
        .pin-display:focus { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan-dim); }
        .pin-controls { display: flex; gap: 12px; justify-content: center; }
        .btn-pin { flex: 1; padding: 12px; background: transparent; border: 1px solid #444; color: #777; font-family: 'Orbitron'; cursor: pointer; transition: all 0.2s; letter-spacing: 2px; }
        .btn-pin:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
        .btn-pin.confirm { border-color: var(--cyan); color: var(--cyan); }
        .btn-pin.confirm:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        .pin-error { color: var(--pink); margin-top: 12px; min-height: 1.2em; font-size: 0.85rem; letter-spacing: 2px; }

        /* ===== DUEL SCREEN ===== */
        #duel-screen {
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            padding: 20px;
            position: relative;
        }
        .duel-lobby { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 90%; max-width: 440px; }
        .duel-lobby h2 {
            font-size: clamp(1.5rem, 3vw, 2.2rem); letter-spacing: 8px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; margin: 0; text-align: center;
        }
        .duel-input {
            width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.6);
            border: 2px solid #333; color: #fff; font-family: 'Orbitron';
            font-size: 1rem; letter-spacing: 3px; text-align: center; outline: none;
            box-sizing: border-box; transition: border-color 0.3s;
        }
        .duel-input:focus { border-color: var(--purple); box-shadow: 0 0 15px rgba(157,0,255,0.3); }
        .duel-input::placeholder { color: #333; letter-spacing: 4px; }
        .duel-select {
            width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.6);
            border: 2px solid #333; color: #fff; font-family: 'Orbitron';
            font-size: 0.9rem; letter-spacing: 2px; text-align: center; outline: none;
            box-sizing: border-box; cursor: pointer; appearance: none; -webkit-appearance: none;
        }
        .duel-select:focus { border-color: var(--purple); }
        .duel-select option { background: #000; color: #fff; }
        .duel-btn-row { display: flex; gap: 12px; width: 100%; }
        .duel-action-btn {
            flex: 1; padding: 14px 10px; background: transparent;
            border: 2px solid var(--purple); color: var(--purple);
            font-family: 'Orbitron'; font-weight: 700; font-size: 0.85rem;
            letter-spacing: 2px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .duel-action-btn:hover { background: var(--purple); color: #fff; box-shadow: 0 0 25px rgba(157,0,255,0.4); }
        .duel-action-btn.pink { border-color: var(--pink); color: var(--pink); }
        .duel-action-btn.pink:hover { background: var(--pink); color: #fff; box-shadow: 0 0 25px rgba(255,0,204,0.4); }
        .duel-action-btn.watch { border-color: var(--cyan); color: var(--cyan); }
        .duel-action-btn.watch:hover { background: var(--cyan); color: #000; }
        .duel-room-display { background: rgba(0,0,0,0.7); border: 2px solid var(--purple); padding: 20px; text-align: center; width: 100%; box-shadow: 0 0 25px rgba(157,0,255,0.12); }
        .duel-room-code { font-size: 3.5rem; font-weight: 900; letter-spacing: 14px; color: var(--purple); text-shadow: 0 0 20px var(--purple); margin: 10px 0; }
        .duel-room-label { font-size: 0.65rem; color: #444; letter-spacing: 5px; }
        .duel-waiting-text { color: #444; font-size: 0.8rem; letter-spacing: 4px; animation: duelPulse 1.5s infinite; }
        .duel-players { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .duel-player-tag { padding: 10px 18px; background: rgba(157,0,255,0.1); border: 1px solid rgba(157,0,255,0.3); color: var(--purple); font-size: 0.9rem; letter-spacing: 3px; text-align: center; }
        .duel-player-tag.opponent { background: rgba(255,0,204,0.1); border-color: rgba(255,0,204,0.3); color: var(--pink); }
        @keyframes duelPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* ── DUEL ARENA LAYOUT ─────────────────────────────────────────────────── */
        /* The arena fills the duel-screen entirely using absolute positioning     */
        /* so it never fights with the parent flex container for space             */
        #duel-arena {
            position: absolute !important;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 20px;
        }

        /* Round header row at top */
        .duel-round-header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .duel-round-label { font-size: clamp(1rem, 2vw, 1.8rem); color: #555; letter-spacing: 8px; text-transform: uppercase; }
        .duel-round-stars { display: flex; justify-content: center; align-items: center; gap: 60px; margin-top: 14px; }
        .duel-star-group { display: flex; align-items: center; gap: 16px; }
        .duel-star-name { font-size: clamp(1.2rem, 2.5vw, 2.2rem); letter-spacing: 4px; font-weight: 900; }
        .duel-stars { display: flex; gap: 10px; }
        .duel-star { font-size: clamp(1.8rem, 3vw, 3rem); opacity: 0.15; transition: opacity 0.4s, transform 0.4s; }
        .duel-star.won { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 8px currentColor); }

        /* BIG timer */
        .duel-timer {
            font-size: clamp(6rem, 18vw, 16rem);
            font-weight: 900; color: #fff;
            text-shadow: 0 0 60px rgba(255,255,255,0.4);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            flex-shrink: 0;
            margin: 8px 0;
        }
        .duel-timer.countdown { color: var(--yellow); text-shadow: 0 0 40px var(--yellow), 0 0 80px rgba(255,240,31,0.3); }
        .duel-timer.go        { color: var(--green);  text-shadow: 0 0 60px var(--green),  0 0 120px rgba(57,255,20,0.3); }

        /* Lanes — full width, score bars */
        .duel-lanes {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
            margin: 10px 0;
        }
        .duel-lane { display: flex; flex-direction: column; gap: 8px; }
        .duel-lane-header { display: flex; justify-content: space-between; align-items: baseline; }
        .duel-lane-name { font-size: clamp(1rem, 2.5vw, 1.6rem); font-weight: 900; letter-spacing: 4px; text-transform: uppercase; }
        .duel-lane-score { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 900; font-variant-numeric: tabular-nums; }

        /* The actual bar track — explicit styling so it never looks like an input */
        .duel-track {
            width: 100%;
            height: clamp(24px, 4vh, 44px);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: block; /* ensure it's a block, never inline */
        }
        /* Kill any inherited input-like styles */
        .duel-track * { box-sizing: border-box; }

        .duel-bar {
            display: block;
            height: 100%;
            width: 0%;
            transition: width 0.2s ease-out;
            border-radius: 3px;
            position: relative;
        }
        .duel-bar::after {
            content: '';
            position: absolute;
            top: 0; right: -4px;
            width: 8px; height: 100%;
            background: rgba(255,255,255,0.6);
            border-radius: 2px;
            filter: blur(3px);
        }
        .duel-bar.p1 {
            background: linear-gradient(90deg, rgba(157,0,255,0.4), var(--purple));
            box-shadow: 0 0 20px var(--purple), inset 0 0 15px rgba(157,0,255,0.3);
        }
        .duel-bar.p2 {
            background: linear-gradient(90deg, rgba(255,0,204,0.4), var(--pink));
            box-shadow: 0 0 20px var(--pink), inset 0 0 15px rgba(255,0,204,0.3);
        }

        /* TAP BUTTON */
        .duel-tap-zone {
            width: clamp(140px, 22vw, 220px);
            height: clamp(140px, 22vw, 220px);
            border-radius: 50%;
            border: 4px solid rgba(157,0,255,0.4);
            background: radial-gradient(circle, rgba(157,0,255,0.15) 0%, rgba(0,0,0,0.7) 70%);
            color: var(--purple);
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            letter-spacing: 4px;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 40px rgba(157,0,255,0.2), inset 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.06s, box-shadow 0.06s;
            position: relative;
            flex-shrink: 0;
            margin-top: 10px;
        }
        .duel-tap-zone:active {
            transform: scale(0.90);
            box-shadow: 0 0 80px rgba(157,0,255,0.6), inset 0 0 40px rgba(157,0,255,0.3);
        }
        .duel-tap-zone::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.35;
            box-shadow: 0 0 20px currentColor;
            animation: pulse 2s infinite;
        }

        /* Overlays */
        .duel-round-flash {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; animation: duelFlashIn 0.3s ease-out;
        }
        .duel-round-flash-title { font-size: 1rem; color: #444; letter-spacing: 8px; margin-bottom: 12px; }
        .duel-round-flash-name {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900; letter-spacing: 5px;
            text-shadow: 0 0 40px currentColor;
        }
        .duel-round-flash-sub { font-size: 0.8rem; color: #333; letter-spacing: 5px; margin-top: 20px; animation: duelPulse 1.5s infinite; }
        @keyframes duelFlashIn { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }

        .duel-result {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .duel-result-title { font-size: clamp(1rem, 2vw, 1.8rem); color: #555; letter-spacing: 8px; margin-bottom: 10px; }
        .duel-result-name {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900; letter-spacing: 5px;
            text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
        }

        .duel-back-btn {
            position: absolute; top: 20px; left: 20px; padding: 10px 22px;
            background: rgba(0,0,0,0.6); border: 1px solid #333; color: #444;
            font-family: 'Orbitron'; font-size: 0.75rem; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; z-index: 100;
        }
        .duel-back-btn:hover { border-color: #fff; color: #fff; }
        .duel-spectator-badge {
            position: absolute; top: 20px; right: 20px; padding: 8px 18px;
            background: rgba(0,243,255,0.08); border: 1px solid rgba(0,243,255,0.4);
            color: var(--cyan); font-family: 'Orbitron'; font-size: 0.65rem;
            letter-spacing: 4px; animation: duelPulse 2s infinite; z-index: 100;
        }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } 100% { transform: translateX(0); } }
    </style>
</head>

<body>
    <div class="grid-bg"></div>

    <!-- SETUP SCREEN -->
    <div id="setup" class="screen">
        <button class="btn-bracket-corner" onclick="showBracket()">TOURNAMENT BRACKET</button>
        <h1>Select Team</h1>
        <div class="btn-grid">
            <button id="btn-select-aranui"   class="btn-aranui"   onclick="joinGame('aranui')">Aranui</button>
            <button id="btn-select-tainui"   class="btn-tainui"   onclick="joinGame('tainui')">Tainui</button>
            <button id="btn-select-mahitahi" class="btn-mahitahi" onclick="joinGame('mahitahi')">Mahi Tahi</button>
            <button id="btn-select-kiakaha"  class="btn-kiakaha"  onclick="joinGame('kiakaha')">Kia Kaha</button>
            <button id="btn-select-tearoha"  class="btn-tearoha"  onclick="joinGame('tearoha')">Te Aroha</button>
            <button id="btn-select-year9"    class="btn-year9"    onclick="joinGame('year9')">YEAR 9</button>
            <button id="btn-select-staff"    class="btn-staff"    onclick="joinGame('staff')">STAFF</button>
        </div>
        <button class="btn-duel" onclick="showDuelLobby()">⚡ 1v1 PRACTICE DUEL</button>
        <button class="btn-host" onclick="showPinModal()">HOST CONTROLS</button>
    </div>

    <!-- PIN MODAL -->
    <div id="pin-modal" class="hidden">
        <div class="pin-box">
            <input type="password" id="pin-input" class="pin-display" maxlength="6" placeholder="PIN"
                onkeydown="checkPinEnter(event)">
            <div class="pin-controls">
                <button class="btn-pin" onclick="closePin()">CANCEL</button>
                <button class="btn-pin confirm" onclick="checkPin()">ACCESS</button>
            </div>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <!-- CONFIRM EXIT MODAL -->
    <div id="confirm-modal" class="hidden">
        <div class="pin-box" style="border-color: var(--pink); box-shadow: 0 0 25px rgba(255,0,204,0.3);">
            <div style="color:var(--pink); font-size:1.6rem; margin-bottom:25px; text-shadow:0 0 15px var(--pink); margin-top:20px;">TERMINATE SYSTEM?</div>
            <div class="pin-controls">
                <button class="btn-pin" onclick="closeConfirm()">CANCEL</button>
                <button class="btn-pin confirm" style="border-color:var(--pink); color:var(--pink);"
                    onclick="confirmExit()"
                    onmouseover="this.style.background='var(--pink)'; this.style.color='#000'"
                    onmouseout="this.style.background='transparent'; this.style.color='var(--pink)'">SHUT DOWN</button>
            </div>
        </div>
    </div>

    <!-- BRACKET SCREEN -->
    <div id="bracket-screen" class="screen hidden">
        <h1 class="bracket-header">TOURNAMENT BRACKET</h1>
        <div class="bracket-wrapper">
            <div class="round round-qtr">
                <div class="match-group"><div class="match"><input class="bracket-input" id="b-q1-a" onchange="saveBracket(this.id,this.value)" placeholder="TEAM 1"><input class="bracket-input" id="b-q1-b" onchange="saveBracket(this.id,this.value)" placeholder="TEAM 2"><div class="connector-right"></div></div></div>
                <div class="match-group"><div class="match"><input class="bracket-input" id="b-q2-a" onchange="saveBracket(this.id,this.value)" placeholder="TEAM 3"><input class="bracket-input" id="b-q2-b" onchange="saveBracket(this.id,this.value)" placeholder="TEAM 4"><div class="connector-right"></div></div></div>
                <div class="match-group"><div class="match"><input class="bracket-input" id="b-q3-a" onchange="saveBracket(this.id,this.value)" placeholder="TEAM 5"><input class="bracket-input" id="b-q3-b" onchange="saveBracket(this.id,this.value)" placeholder="BYE"><div class="connector-right"></div></div></div>
                <div class="match-group"><div class="match"><input class="bracket-input" id="b-q4-a" onchange="saveBracket(this.id,this.value)" placeholder="BYE"><input class="bracket-input" id="b-q4-b" onchange="saveBracket(this.id,this.value)" placeholder="BYE"><div class="connector-right"></div></div></div>
            </div>
            <div class="round round-semi">
                <div class="match-group two-into-one"><div class="connector-left"></div><div class="match single"><input class="bracket-input" id="b-s1-a" onchange="saveBracket(this.id,this.value)" placeholder="WINNER Q1/Q2"><input class="bracket-input" id="b-s1-b" onchange="saveBracket(this.id,this.value)" placeholder="WINNER Q3/Q4"><div class="connector-right"></div></div></div>
                <div class="match-group two-into-one"><div class="connector-left"></div><div class="match single"><input class="bracket-input" id="b-s2-a" onchange="saveBracket(this.id,this.value)" placeholder="WINNER Q5/Q6"><input class="bracket-input" id="b-s2-b" onchange="saveBracket(this.id,this.value)" placeholder="WINNER Q7/Q8"><div class="connector-right"></div></div></div>
            </div>
            <div class="round round-finals">
                <div class="match-group two-into-one"><div class="connector-left"></div><div class="match single"><input class="bracket-input" id="b-f1-a" onchange="saveBracket(this.id,this.value)" placeholder="FINALIST A"><input class="bracket-input" id="b-f1-b" onchange="saveBracket(this.id,this.value)" placeholder="FINALIST B"><div class="connector-right"></div></div></div>
            </div>
            <div class="round round-champion">
                <div class="match-group two-into-one"><div class="connector-left"></div><div class="match final-match"><div class="final-label">CHAMPION</div><input class="bracket-input champion" id="b-winner" onchange="saveBracket(this.id,this.value)" placeholder="AWAITING DATA"></div></div>
            </div>
        </div>
        <div class="bracket-controls">
            <button class="control-btn" onclick="goToSetup()">BACK</button>
            <button class="control-btn primary" id="btn-populate" onclick="populateBracket()">POPULATE TEAMS</button>
            <button class="control-btn danger" id="btn-clear-bracket" onclick="clearBracket()">CLEAR</button>
        </div>
    </div>

    <!-- HOST SCREEN -->
    <div id="host" class="screen hidden">
        <div id="winner-overlay" class="hidden">
            <div id="winner-trophy" class="trophy-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;">
                    <path d="M6 9C6 9 6.5 17 12 17C17.5 17 18 9 18 9"></path><path d="M6 9H18"></path>
                    <path d="M6 9C3 9 2 6 2 4C2 2 4 2 6 2H18C20 2 22 2 22 4C22 6 21 9 18 9"></path>
                    <path d="M12 17V22"></path><path d="M8 22H16"></path><circle cx="12" cy="7" r="2"></circle>
                </svg>
            </div>
            <h2 id="winner-title-text" class="winner-title">ROUND WINNER</h2>
            <h1 id="winner-name-text" class="winner-name">TEAM NAME</h1>
            <button class="winner-close-btn" onclick="closeWinner()">CONTINUE</button>
        </div>

        <!-- Top HUD Bar -->
        <div class="host-hud-bar">
            <div class="hud-live-badge">⬤ LIVE</div>
            <div id="timer-display">15</div>
            <div id="race-lights">
                <div class="light" id="light-1"></div>
                <div class="light" id="light-2"></div>
                <div class="light" id="light-3"></div>
                <div class="light" id="light-4"></div>
                <div class="light" id="light-5"></div>
            </div>
        </div>

        <!-- Match Setup Panel -->
        <div id="match-setup">
            <div style="display:flex;justify-content:center;width:100%;margin-bottom:5px;">
                <label class="setup-checkbox" style="color:var(--cyan);font-size:0.85rem;">
                    <input type="checkbox" id="chk-auto-director" onchange="evaluateBracketState()">
                    AUTO-RUN TOURNAMENT (DIRECTOR MODE)
                </label>
            </div>
            <div class="immersive-hint" style="width:100%;text-align:center;color:#444;font-size:0.65rem;margin-top:2px;">PRESS 'H' TO TOGGLE HUD</div>
            <span style="color:#555;letter-spacing:2px;">ACTIVE:</span>
            <label class="setup-checkbox"><input type="checkbox" id="chk-aranui"   onchange="updateActiveTeams()"> Aranui</label>
            <label class="setup-checkbox"><input type="checkbox" id="chk-tainui"   onchange="updateActiveTeams()"> Tainui</label>
