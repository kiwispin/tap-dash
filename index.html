    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // ─── CONFIGURATION ───────────────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyBc-YmY5nbcS_5vasnZpRJKk-LZCgpuelc",
            authDomain: "tap-dash-de913.firebaseapp.com",
            databaseURL: "https://tap-dash-de913-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tap-dash-de913",
            storageBucket: "tap-dash-de913.firebasestorage.app",
            messagingSenderId: "460696612922",
            appId: "1:460696612922:web:0ea287df21750d0ff50503"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ─── GLOBAL STATE ─────────────────────────────────────────────────────────
        let myTeam = null;
        let isHost  = false;

        const teams = [
            { id: 'aranui',   name: 'Aranui',   color: 'pink'   },
            { id: 'tainui',   name: 'Tainui',   color: 'yellow' },
            { id: 'mahitahi', name: 'Mahi Tahi',color: 'orange' },
            { id: 'kiakaha',  name: 'Kia Kaha', color: 'green'  },
            { id: 'tearoha',  name: 'Te Aroha', color: 'blue'   },
            { id: 'year9',    name: 'YEAR 9',   color: 'white'  },
            { id: 'staff',    name: 'STAFF',    color: 'purple' }
        ];

        const currentScores = {};
        const teamWins = {};
        teams.forEach(t => { currentScores[t.id] = 0; teamWins[t.id] = 0; });

        const winningScore   = 300;
        const ROUND_DURATION = 15;

        let gameInterval, countdownInterval;
        let isSequenceRunning = false;
        let audioCtx;
        let pendingTaps = 0;

        // ─── SETUP SCREEN LISTENERS ───────────────────────────────────────────────
        db.ref('game/activeTeams').on('value', snap => {
            const active = snap.val();
            if (!active) return;
            teams.forEach(t => {
                const btn = document.getElementById(`btn-select-${t.id}`);
                if (btn) btn.classList.toggle('disabled-team', !active[t.id]);
            });
        });

        // ─── BRACKET ─────────────────────────────────────────────────────────────
        function showBracket() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('host').classList.add('hidden');
            document.getElementById('bracket-screen').classList.remove('hidden');
            const inputs = document.querySelectorAll('.bracket-input');
            inputs.forEach(input => {
                input.readOnly = !isHost;
                input.style.pointerEvents = isHost ? '' : 'none';
                input.style.opacity = isHost ? '' : '0.75';
            });
            document.getElementById('btn-populate').style.display  = isHost ? '' : 'none';
            document.getElementById('btn-clear-bracket').style.display = isHost ? '' : 'none';
            db.ref('bracket').on('value', snap => {
                const data = snap.val() || {};
                document.querySelectorAll('.bracket-input').forEach(input => { input.value = data[input.id] || ''; });
            });
        }
        function goToSetup() { document.getElementById('bracket-screen').classList.add('hidden'); document.getElementById('setup').classList.remove('hidden'); }
        function saveBracket(id, val)  { if (!isHost) return; db.ref(`bracket/${id}`).set(val); }
        function populateBracket() {
            if (!isHost) return;
            const shuffled = [...teams].sort(() => Math.random() - 0.5);
            const defaults = {
                'b-q1-a': shuffled[0].name, 'b-q1-b': shuffled[1].name,
                'b-q2-a': shuffled[2].name, 'b-q2-b': shuffled[3].name,
                'b-q3-a': shuffled[4].name, 'b-q3-b': shuffled[5].name,
                'b-q4-a': shuffled[6].name, 'b-q4-b': 'BYE',
                'b-s1-a': '', 'b-s1-b': '', 'b-s2-a': '', 'b-s2-b': '',
                'b-f1-a': '', 'b-f1-b': '', 'b-winner': ''
            };
            for (const [k, v] of Object.entries(defaults)) { const el = document.getElementById(k); if (el) el.value = v; }
            const updates = {};
            for (const [k, v] of Object.entries(defaults)) updates[`bracket/${k}`] = v;
            db.ref().update(updates);
        }
        function clearBracket() {
            if (!isHost) return;
            db.ref('bracket').set(null);
            document.querySelectorAll('.bracket-input').forEach(i => i.value = '');
        }
        window.clearBracket    = clearBracket;
        window.populateBracket = populateBracket;
        window.saveBracket     = saveBracket;
        window.showBracket     = showBracket;
        window.goToSetup       = goToSetup;

        // ─── AUDIO ────────────────────────────────────────────────────────────────
        function initAudio() {
            if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playBeep(type, val) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g   = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            if (type === 'count') {
                const step = 5 - (val || 5);
                const freq = 220 + step * 55;
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.1);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'go') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const gw = audioCtx.createGain();
                    o.connect(gw); gw.connect(audioCtx.destination); o.type = 'triangle';
                    o.frequency.value = freq;
                    gw.gain.setValueAtTime(0, now + i * 0.1);
                    gw.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.05);
                    gw.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.5);
                });
            }
        }

        // ─── CLIENT ───────────────────────────────────────────────────────────────
        let isClientInitialized = false;
        let tapTimestamps = [];

        function joinGame(teamId) {
            const btn = document.getElementById(`btn-select-${teamId}`);
            if (btn && btn.classList.contains('disabled-team')) return;
            myTeam = teamId;
            document.getElementById('setup').classList.add('hidden');
            const clientScreen = document.getElementById('client');
            clientScreen.classList.remove('hidden');
            const teamObj = teams.find(t => t.id === teamId);
            const colorVar = `var(--${teamObj.color})`;
            document.getElementById('tap-btn').style.color    = colorVar;
            document.getElementById('practice-btn').style.color = colorVar;
            document.getElementById('msg').style.color        = colorVar;

            if (!isClientInitialized) {
                isClientInitialized = true;
                db.ref('game/status').on('value', snap => {
                    const status = snap.val();
                    if (status === 'playing') {
                        clientScreen.classList.remove('locked');
                        document.getElementById('msg').innerText = 'ENGAGED';
                        document.getElementById('tps-display').classList.add('hidden');
                        tapTimestamps = [];
                        if (navigator.vibrate) navigator.vibrate(50);
                    } else {
                        clientScreen.classList.add('locked');
                        document.getElementById('msg').innerText = 'STANDBY';
                        document.getElementById('tps-display').classList.remove('hidden');
                    }
                });
                const ev = 'ontouchstart' in window ? 'touchstart' : 'click';
                document.getElementById('tap-btn').addEventListener(ev, e => { e.preventDefault(); handleTap(); });
                document.getElementById('practice-btn').addEventListener(ev, e => { e.preventDefault(); handlePracticeTap(); });
                setInterval(flushPendingTaps, 300);
                setInterval(() => {
                    if (document.getElementById('client').classList.contains('hidden')) return;
                    const now = Date.now();
                    tapTimestamps = tapTimestamps.filter(t => now - t <= 1000);
                    const tpsEl = document.getElementById('tps-display');
                    if (!tpsEl.classList.contains('hidden')) tpsEl.innerText = tapTimestamps.length + ' TPS';
                }, 100);
            }
        }

        function handleTap() {
            if (document.getElementById('client').classList.contains('locked')) return;
            tapTimestamps.push(Date.now());
            pendingTaps++;
            const btn = document.getElementById('tap-btn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);
        }
        function handlePracticeTap() {
            tapTimestamps.push(Date.now());
            const btn = document.getElementById('practice-btn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);
        }
        function flushPendingTaps() {
            if (pendingTaps > 0 && myTeam) {
                const c = pendingTaps; pendingTaps = 0;
                db.ref(`scores/${myTeam}`).transaction(cur => (cur || 0) + c);
            }
        }

        function showSetup() {
            document.getElementById('setup').classList.remove('hidden');
            ['host','client','bracket-screen'].forEach(id => document.getElementById(id).classList.add('hidden'));
        }
        function exitClient() { myTeam = null; showSetup(); }
        window.onload = function () {
            showSetup();
            document.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('immersive'); });
        };

        // ─── HOST ─────────────────────────────────────────────────────────────────
        function initHost() {
            isHost = true;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('host').classList.remove('hidden');
            initAudio();

            const board = document.getElementById('scoreboard');
            board.innerHTML = '<div class="vs-watermark">VS</div>';
            teams.forEach(t => {
                board.innerHTML += `
<div class="lane" id="lane-${t.id}" style="z-index:1;">
    <div class="lane-info">
        <div class="lane-label" style="color:var(--${t.color})">${t.name}</div>
        <div style="font-size:0.6rem;color:#444;letter-spacing:3px;margin-bottom:2px;">BEST OF 3</div>
        <div class="win-dots" id="dots-${t.id}">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>
    <div class="track">
        <div id="bar-${t.id}" class="bar bg-${t.id}"></div>
        <div id="score-${t.id}" class="score-text" style="position:absolute;right:-110px;top:50%;transform:translateY(-50%);">0</div>
    </div>
    <div></div>
</div>`;
            });

            updateActiveTeams();
            teams.forEach(t => {
                db.ref(`scores/${t.id}`).on('value', snap => {
                    const score = snap.val() || 0;
                    currentScores[t.id] = score;
                    document.getElementById(`bar-${t.id}`).style.width = `${Math.min((score / winningScore) * 100, 100)}%`;
                    document.getElementById(`score-${t.id}`).innerText = score;
                });
            });
            db.ref('wins').on('value', snap => {
                const winsData = snap.val() || {};
                teams.forEach(t => { teamWins[t.id] = winsData[t.id] || 0; updateDots(t.id); });
            });
            db.ref('game/status').on('value', snap => {
                const status = snap.val();
                const badge = document.getElementById('host-status');
                if (status === 'playing') { badge.innerText = 'SYSTEM ACTIVE'; badge.classList.add('active'); }
                else { badge.innerText = 'SYSTEM IDLE'; badge.classList.remove('active'); }
            });
            document.addEventListener('keydown', e => {
                if (e.repeat) return;
                if (e.code === 'Space') startSequence();
                if (e.code === 'KeyR') resetScores();
            });
        }

        function updateActiveTeams() {
            if (!isHost) return;
            const updates = {};
            teams.forEach(t => {
                const isChecked = document.getElementById(`chk-${t.id}`).checked;
                updates[`game/activeTeams/${t.id}`] = isChecked;
                const lane = document.getElementById(`lane-${t.id}`);
                if (lane) lane.classList.toggle('inactive', !isChecked);
            });
            db.ref().update(updates);
        }

        function determineWinner() {
            let maxScore = -1, winningTeamId = null;
            teams.forEach(t => {
                if (document.getElementById(`chk-${t.id}`).checked) {
                    if (currentScores[t.id] > maxScore) { maxScore = currentScores[t.id]; winningTeamId = t.id; }
                }
            });
            if (!winningTeamId || maxScore <= 0) return;
            const newWins = (teamWins[winningTeamId] || 0) + 1;
            db.ref(`wins/${winningTeamId}`).set(newWins);
            const isDirector = document.getElementById('chk-auto-director')?.checked;
            const winThreshold = isDirector ? targetWins : 2;
            const isMatchWin = newWins >= winThreshold;
            if (isMatchWin && isDirector) directorHandleWin(winningTeamId);
            showWinnerOverlay(winningTeamId, isMatchWin);
        }

        function updateDots(teamId) {
            const container = document.getElementById(`dots-${teamId}`);
            if (!container) return;
            container.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i < teamWins[teamId]);
            });
        }

        function showWinnerOverlay(teamId, isMatchWin) {
            const team = teams.find(t => t.id === teamId);
            if (!team) return;
            document.getElementById('winner-title-text').innerText = isMatchWin ? 'MATCH WINNER' : 'ROUND WINNER';
            document.getElementById('winner-title-text').style.color = isMatchWin ? '#fff' : '#888';
            document.getElementById('winner-name-text').innerText = team.name;
            document.getElementById('winner-name-text').style.color = `var(--${team.color})`;
            document.getElementById('winner-trophy').style.color = `var(--${team.color})`;
            playBeep('win');
            document.getElementById('winner-overlay').classList.remove('hidden');
        }
        function closeWinner() { document.getElementById('winner-overlay').classList.add('hidden'); }

        function setLights(state) {
            const lights = document.querySelectorAll('.light');
            const container = document.getElementById('race-lights');
            if (state === 0)  { lights.forEach(l => l.classList.remove('active')); container.classList.remove('go-signal'); }
            else if (state === -1) { container.classList.add('go-signal'); }
        }

        function startSequence() {
            if (!isHost || isSequenceRunning) return;
            resetScores(true); closeWinner();
            isSequenceRunning = true;
            setLights(0);
            let count = 5;
            document.getElementById('timer-display').style.color = 'var(--yellow)';
            runCountdownBeat(count);
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) runCountdownBeat(count);
                else { clearInterval(countdownInterval); startGameplay(); }
            }, 1000);
        }
        function runCountdownBeat(num) {
            document.getElementById('timer-display').innerText = num;
            playBeep('count', num);
            const light = document.getElementById(`light-${6 - num}`);
            if (light) light.classList.add('active');
        }
        function startGameplay() {
            let timeLeft = ROUND_DURATION;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.style.color = 'var(--green)';
            timerDisplay.innerText = 'GO';
            setLights(-1);
            playBeep('go');
            db.ref('game/status').set('playing');
            setTimeout(() => {
                timerDisplay.style.color = '#fff';
                timerDisplay.innerText = timeLeft;
                setLights(0);
                gameInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if (timeLeft <= 0) { clearInterval(gameInterval); endRound(); }
                }, 1000);
            }, 1000);
        }
        function endRound() {
            db.ref('game/status').set('paused');
            isSequenceRunning = false;
            document.getElementById('timer-display').style.color = '#555';
            document.getElementById('timer-display').innerText = '0';
            determineWinner();
        }

        function resetScores(force) {
            if (!isHost) return;
            if (!force && !confirm('Reset current scores? (Dots/Wins will remain)')) return;
            closeWinner();
            clearInterval(gameInterval); clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => updates[`scores/${t.id}`] = 0);
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }
        function resetMatch(force) {
            if (!isHost) return;
            if (!force && !confirm('NEW MATCH? This will clear ALL scores and Win Dots.')) return;
            closeWinner();
            clearInterval(gameInterval); clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => { updates[`scores/${t.id}`] = 0; updates[`wins/${t.id}`] = 0; });
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }

        // ─── TOURNAMENT DIRECTOR ──────────────────────────────────────────────────
        const bracketMatches = [
            { id:'q1', inputs:['b-q1-a','b-q1-b'], target:'b-s1-a', bestOf:3 },
            { id:'q2', inputs:['b-q2-a','b-q2-b'], target:'b-s1-b', bestOf:3 },
            { id:'q3', inputs:['b-q3-a','b-q3-b'], target:'b-s2-a', bestOf:3 },
            { id:'q4', inputs:['b-q4-a','b-q4-b'], target:'b-s2-b', bestOf:3 },
            { id:'s1', inputs:['b-s1-a','b-s1-b'], target:'b-f1-a', bestOf:3 },
            { id:'s2', inputs:['b-s2-a','b-s2-b'], target:'b-f1-b', bestOf:3 },
            { id:'f1', inputs:['b-f1-a','b-f1-b'], target:'b-winner', bestOf:5 }
        ];
        let currentDirectorMatch = null;
        let targetWins = 2;

        function evaluateBracketState() {
            const isAuto = document.getElementById('chk-auto-director')?.checked;
            if (!isAuto) { targetWins = 2; return; }
            let foundMatch = null;
            for (const match of bracketMatches) {
                const valA = document.getElementById(match.inputs[0])?.value;
                const valB = document.getElementById(match.inputs[1])?.value;
                const valTarget = document.getElementById(match.target)?.value;
                if (valA && valB && !valTarget) {
                    if (valA === 'BYE') { saveBracket(match.target, valB); setTimeout(evaluateBracketState, 500); return; }
                    if (valB === 'BYE') { saveBracket(match.target, valA); setTimeout(evaluateBracketState, 500); return; }
                }
                if (!foundMatch && valA && valB && valA !== 'BYE' && valB !== 'BYE' && !valTarget) foundMatch = match;
            }
            if (foundMatch) activateMatch(foundMatch);
        }

        function activateMatch(match) {
            currentDirectorMatch = match;
            targetWins = Math.ceil(match.bestOf / 2);
            const teamNameA = document.getElementById(match.inputs[0])?.value;
            const teamNameB = document.getElementById(match.inputs[1])?.value;
            let idA = null, idB = null;
            teams.forEach(t => { if (t.name === teamNameA) idA = t.id; if (t.name === teamNameB) idB = t.id; });
            if (idA && idB) {
                let needsUpdate = false;
                teams.forEach(t => {
                    const chk = document.getElementById(`chk-${t.id}`);
                    const should = (t.id === idA || t.id === idB);
                    if (chk.checked !== should) { chk.checked = should; needsUpdate = true; }
                });
                if (needsUpdate) { updateActiveTeams(); resetMatch(true); }
            }
        }

        function directorHandleWin(winningTeamId) {
            if (!currentDirectorMatch) return;
            const wt = teams.find(t => t.id === winningTeamId);
            if (!wt) return;
            saveBracket(currentDirectorMatch.target, wt.name);
            setTimeout(evaluateBracketState, 2000);
        }

        // ─── HOST EXIT ────────────────────────────────────────────────────────────
        function exitHost()    { document.getElementById('confirm-modal').classList.remove('hidden'); }
        function closeConfirm(){ document.getElementById('confirm-modal').classList.add('hidden'); }
        function confirmExit() {
            closeConfirm(); isHost = false;
            showSetup();
            clearInterval(gameInterval); clearInterval(countdownInterval);
        }
        window.exitHost    = exitHost;
        window.closeConfirm= closeConfirm;
        window.confirmExit = confirmExit;

        // ─── PIN ──────────────────────────────────────────────────────────────────
        function showPinModal() {
            document.getElementById('pin-modal').classList.remove('hidden');
            const input = document.getElementById('pin-input');
            input.value = ''; input.focus();
            document.getElementById('pin-error').innerText = '';
        }
        function closePin() { document.getElementById('pin-modal').classList.add('hidden'); }
        function checkPin() {
            if (document.getElementById('pin-input').value === '120126') { closePin(); initHost(); }
            else {
                document.getElementById('pin-error').innerText = 'ACCESS DENIED';
                const box = document.querySelector('#pin-modal .pin-box');
                box.style.animation = 'shake 0.4s ease';
                setTimeout(() => box.style.animation = '', 400);
            }
        }
        function checkPinEnter(e) { if (e.key === 'Enter') checkPin(); }
        window.showPinModal = showPinModal;
        window.closePin     = closePin;
        window.checkPin     = checkPin;
        window.checkPinEnter= checkPinEnter;

        // ═══════════════════════════════════════════════════════════════════════════
        // 1v1 DUEL MODE — FIXED ROUND PROGRESSION
        // ═══════════════════════════════════════════════════════════════════════════
        //
        // ROOT CAUSE OF THE BUG:
        // The old code used a single Firebase 'status' field flipping between states.
        // When status was set to 'countdown' for a new round, the listener guard
        //   (duelState !== 'countdown' && duelState !== 'playing')
        // would sometimes block re-entry, OR race conditions between local state
        // and the Firebase listener would cause inconsistent behaviour.
        //
        // FIX: We now use a dedicated 'roundCounter' integer in Firebase.
        // Incrementing it is the signal to start a new round. The arena listener
        // watches this counter. There is NO ambiguity — an increment always
        // means "start a fresh round", regardless of previous duelState.
        // ═══════════════════════════════════════════════════════════════════════════

        const DUEL_DURATION      = 10;
        const DUEL_WINNING_SCORE = 200;

        let duelRoundsToWin  = 2;
        let duelMaxRounds    = 3;
        let duelRoomCode     = null;
        let duelMyName       = null;
        let duelIsSpectator  = false;
        let duelListeners    = [];
        let duelPendingTaps  = 0;
        let duelFlushInterval= null;
        let duelGameInterval = null;
        let duelState        = 'idle';
        let duelRoundWins    = {};
        let duelCurrentRound = 1;
        let duelPlayerNames  = [];
        // Track the last round counter value we responded to (prevents duplicate triggers)
        let duelLastRoundCounter = 0;

        function showDuelLobby() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('duel-screen').classList.remove('hidden');
            document.getElementById('duel-lobby').classList.remove('hidden');
            document.getElementById('duel-waiting').classList.add('hidden');
            document.getElementById('duel-arena').classList.add('hidden');
            document.getElementById('duel-error').innerText = '';
            document.getElementById('duel-join-row').classList.add('hidden');
            document.getElementById('duel-watch-row').classList.add('hidden');
            duelIsSpectator = false;
            duelState = 'idle';
        }

        function showJoinInput() {
            document.getElementById('duel-watch-row').classList.add('hidden');
            const row = document.getElementById('duel-join-row');
            row.classList.remove('hidden'); row.style.display = 'flex';
            document.getElementById('duel-code-input').focus();
        }
        function showWatchInput() {
            document.getElementById('duel-join-row').classList.add('hidden');
            const row = document.getElementById('duel-watch-row');
            row.classList.remove('hidden'); row.style.display = 'flex';
            document.getElementById('duel-watch-code-input').focus();
        }

        function watchDuelRoom() {
            const code = document.getElementById('duel-watch-code-input').value.trim().toUpperCase();
            if (!code || code.length !== 4) { document.getElementById('duel-error').innerText = 'ENTER 4-CHAR CODE'; return; }
            db.ref(`duels/${code}`).once('value').then(snap => {
                if (!snap.val()) { document.getElementById('duel-error').innerText = 'ROOM NOT FOUND'; return; }
                duelRoomCode = code; duelMyName = null; duelIsSpectator = true;
                showDuelWaiting(); listenToDuelRoom();
            });
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function createDuelRoom() {
            const name = document.getElementById('duel-name-input').value.trim().toUpperCase();
            if (!name) { document.getElementById('duel-error').innerText = 'ENTER YOUR NAME'; return; }
            const format = document.getElementById('duel-format-select')?.value || 'best_of_3';
            duelMyName   = name;
            duelRoomCode = generateRoomCode();
            db.ref(`duels/${duelRoomCode}`).set({
                players: { [name]: true },
                scores:  { [name]: 0 },
                roundWins: { [name]: 0 },
                roundCounter: 0,  // NEW: the trigger for starting/restarting rounds
                status: 'waiting',
                format: format,
                created: firebase.database.ServerValue.TIMESTAMP
            }).then(() => { showDuelWaiting(); listenToDuelRoom(); });
        }

        function joinDuelRoom() {
            const name = document.getElementById('duel-name-input').value.trim().toUpperCase();
            if (!name) { document.getElementById('duel-error').innerText = 'ENTER YOUR NAME'; return; }
            const code = document.getElementById('duel-code-input').value.trim().toUpperCase();
            if (!code || code.length !== 4) { document.getElementById('duel-error').innerText = 'ENTER 4-CHAR CODE'; return; }
            duelMyName = name; duelRoomCode = code;
            db.ref(`duels/${code}`).once('value').then(snap => {
                const data = snap.val();
                if (!data) { document.getElementById('duel-error').innerText = 'ROOM NOT FOUND'; duelRoomCode = null; return; }
                const players = data.players || {};
                if (Object.keys(players).length >= 2) { document.getElementById('duel-error').innerText = 'ROOM IS FULL'; duelRoomCode = null; return; }
                if (players[name]) { document.getElementById('duel-error').innerText = 'NAME TAKEN'; duelRoomCode = null; return; }
                db.ref(`duels/${code}/players/${name}`).set(true);
                db.ref(`duels/${code}/scores/${name}`).set(0);
                db.ref(`duels/${code}/roundWins/${name}`).set(0);
                showDuelWaiting(); listenToDuelRoom();
            });
        }

        function showDuelWaiting() {
            document.getElementById('duel-lobby').classList.add('hidden');
            document.getElementById('duel-waiting').classList.remove('hidden');
            document.getElementById('duel-my-code').innerText = duelRoomCode;
            duelState = 'waiting';
        }

        function listenToDuelRoom() {
            // Players list listener
            const playersRef = db.ref(`duels/${duelRoomCode}/players`);
            const playersListener = playersRef.on('value', snap => {
                const players = snap.val() || {};
                const names = Object.keys(players);
                const listEl = document.getElementById('duel-players-list');
                if (listEl) {
                    listEl.innerHTML = '';
                    names.forEach(n => {
                        const tag = document.createElement('div');
                        tag.className = 'duel-player-tag' + (n !== duelMyName ? ' opponent' : '');
                        tag.innerText = n + (n === duelMyName ? ' (YOU)' : '');
                        listEl.appendChild(tag);
                    });
                }
                const statusText = document.getElementById('duel-status-text');
                const startBtn   = document.getElementById('duel-start-btn');
                if (!statusText) return;
                if (names.length >= 2) {
                    statusText.innerText = duelIsSpectator ? 'WAITING FOR PLAYERS...' : 'READY TO DUEL!';
                    statusText.style.color = duelIsSpectator ? 'var(--cyan)' : 'var(--green)';
                    if (startBtn) startBtn.style.display = duelIsSpectator ? 'none' : 'block';
                } else {
                    statusText.innerText = 'WAITING FOR OPPONENT...';
                    statusText.style.color = '#444';
                    if (startBtn) startBtn.style.display = 'none';
                }
            });
            duelListeners.push({ ref: playersRef, event: 'value', fn: playersListener });

            // ── KEY FIX: Listen on roundCounter, not 'status' ──────────────────
            // roundCounter increments each time a new round should begin.
            // We record the last value we acted on (duelLastRoundCounter) to
            // avoid responding to the same increment twice.
            const roundCounterRef = db.ref(`duels/${duelRoomCode}/roundCounter`);
            const roundCounterListener = roundCounterRef.on('value', snap => {
                const counter = snap.val();
                if (counter === null) return;
                if (counter === 0) {
                    // A rematch reset happened — reset our local tracker
                    duelLastRoundCounter = 0;
                    return;
                }
                if (counter <= duelLastRoundCounter) return;   // Already handled this value
                duelLastRoundCounter = counter;
                enterDuelArena();
            });
            duelListeners.push({ ref: roundCounterRef, event: 'value', fn: roundCounterListener });

            // Status listener for 'finished' (match over)
            const statusRef = db.ref(`duels/${duelRoomCode}/status`);
            const statusListener = statusRef.on('value', snap => {
                if (snap.val() === 'finished' && duelState === 'playing') {
                    // The match result will already be shown locally; this handles spectators
                }
            });
            duelListeners.push({ ref: statusRef, event: 'value', fn: statusListener });
        }

        function startDuel() {
            if (!duelRoomCode) return;
            db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                const players = Object.keys(snap.val() || {});
                const scoreUpdates = {}; const rwUpdates = {};
                players.forEach(n => { scoreUpdates[n] = 0; rwUpdates[n] = 0; });
                duelRoundWins    = rwUpdates;
                duelCurrentRound = 1;
                duelPlayerNames  = players;
                db.ref(`duels/${duelRoomCode}/scores`).set(scoreUpdates);
                db.ref(`duels/${duelRoomCode}/roundWins`).set(rwUpdates);
                db.ref(`duels/${duelRoomCode}/currentRound`).set(1);
                db.ref(`duels/${duelRoomCode}/winner`).remove();
                // Mark the creator as the round driver so only one device calls startNextRound
                db.ref(`duels/${duelRoomCode}/roundDriver`).set(duelMyName);
                // Increment roundCounter to trigger arena entry on ALL devices
                db.ref(`duels/${duelRoomCode}/roundCounter`).set(1);
            });
        }

        function startNextRound() {
            if (!duelRoomCode) return;
            // Reset scores for the new round
            db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                const players = Object.keys(snap.val() || {});
                const scoreUpdates = {};
                players.forEach(n => scoreUpdates[n] = 0);
                db.ref(`duels/${duelRoomCode}/scores`).set(scoreUpdates);
                db.ref(`duels/${duelRoomCode}/currentRound`).set(duelCurrentRound);
                // Increment the counter — triggers arena entry on ALL devices
                db.ref(`duels/${duelRoomCode}/roundCounter`).transaction(c => (c || 0) + 1);
            });
        }

        function enterDuelArena() {
            // duelLastRoundCounter already prevents duplicate triggers for the same round.
            // We do NOT guard on duelState here — doing so blocked the non-driver from
            // re-entering after their local state got out of sync.
            duelState = 'countdown';

            // Clear previous arena-specific listeners
            duelListeners = duelListeners.filter(l => {
                if (l.arena) { l.ref.off(l.event, l.fn); return false; }
                return true;
            });

            document.getElementById('duel-waiting').classList.add('hidden');
            document.getElementById('duel-lobby').classList.add('hidden');
            document.getElementById('duel-arena').classList.remove('hidden');
            document.getElementById('duel-result').classList.add('hidden');
            document.getElementById('duel-round-flash').classList.add('hidden');
            // Reset timer appearance
            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer';
            timerEl.style.color = '';
            timerEl.innerText = '3';

            if (duelIsSpectator) {
                document.getElementById('duel-tap-container').style.display = 'none';
                document.getElementById('duel-spectator-badge').classList.remove('hidden');
            } else {
                document.getElementById('duel-tap-container').style.display = 'flex';
                document.getElementById('duel-tap-container').style.justifyContent = 'center';
                document.getElementById('duel-spectator-badge').classList.add('hidden');
            }

            initAudio();

            // Read format + round state from Firebase
            db.ref(`duels/${duelRoomCode}`).once('value').then(snap => {
                const data = snap.val() || {};
                const format = data.format || 'best_of_3';
                if (format === '1_round') { duelRoundsToWin = 1; duelMaxRounds = 1; }
                else { duelRoundsToWin = 2; duelMaxRounds = 3; }

                duelCurrentRound = data.currentRound || 1;
                duelRoundWins    = data.roundWins    || {};
                const players    = Object.keys(data.players || {});
                duelPlayerNames  = players;

                updateDuelRoundUI();

                // Work out this player's colour based on their index
                const myIndex    = players.indexOf(duelMyName);
                const myColor    = myIndex === 0 ? 'var(--purple)' : myIndex === 1 ? 'var(--pink)' : 'var(--purple)';
                const myColorHex = myIndex === 0 ? 'rgba(157,0,255,' : 'rgba(255,0,204,';

                // Build lanes
                const lanesEl = document.getElementById('duel-lanes');
                lanesEl.innerHTML = '';
                players.forEach((name, i) => {
                    const isMe   = name === duelMyName;
                    const color  = i === 0 ? 'var(--purple)' : 'var(--pink)';
                    const barCls = i === 0 ? 'p1' : 'p2';
                    const safeId = 'player_' + i;

                    const lane = document.createElement('div');
                    lane.className = 'duel-lane';
                    lane.innerHTML = `
                        <div class="duel-lane-header">
                            <span class="duel-lane-name" style="color:${color}">${name}${isMe ? ' ★' : ''}</span>
                            <span class="duel-lane-score" id="duel-score-${safeId}" style="color:${color}">0</span>
                        </div>
                        <div class="duel-track">
                            <div class="duel-bar ${barCls}" id="duel-bar-${safeId}"></div>
                        </div>`;
                    lane.dataset.playerName = name;
                    lanesEl.appendChild(lane);
                });

                // Scores listener — look up by player index, not name-as-id
                const scoresRef = db.ref(`duels/${duelRoomCode}/scores`);
                const scoresListener = scoresRef.on('value', snap => {
                    const scores = snap.val() || {};
                    players.forEach((name, i) => {
                        const safeId  = 'player_' + i;
                        const score   = scores[name] || 0;
                        const scoreEl = document.getElementById(`duel-score-${safeId}`);
                        const barEl   = document.getElementById(`duel-bar-${safeId}`);
                        if (scoreEl) scoreEl.innerText = score;
                        if (barEl)   barEl.style.width = Math.min((score / DUEL_WINNING_SCORE) * 100, 100) + '%';
                    });
                });
                duelListeners.push({ ref: scoresRef, event: 'value', fn: scoresListener, arena: true });

                // Round wins listener
                const rwRef = db.ref(`duels/${duelRoomCode}/roundWins`);
                const rwListener = rwRef.on('value', snap => {
                    duelRoundWins = snap.val() || {};
                    updateDuelRoundUI();
                });
                duelListeners.push({ ref: rwRef, event: 'value', fn: rwListener, arena: true });

                // ── Tap button: rebind listener + apply player colour ──────────
                // Done INSIDE the promise so it always happens after lanes are built
                // and the container is definitely visible before we clone the button.
                const tapContainer = document.getElementById('duel-tap-container');
                if (duelIsSpectator) {
                    tapContainer.style.display = 'none';
                } else {
                    tapContainer.style.display = 'flex';
                    tapContainer.style.justifyContent = 'center';

                    // Rebind by cloning (removes stale listeners from previous rounds)
                    const oldBtn = document.getElementById('duel-tap-btn');
                    const newBtn = oldBtn.cloneNode(true);
                    oldBtn.parentNode.replaceChild(newBtn, oldBtn);

                    // Colour the button to match this player's lane colour
                    newBtn.style.color        = myColor;
                    newBtn.style.borderColor  = myColor.replace('var(--', '').replace(')', ''); // fallback
                    newBtn.style.border       = `4px solid ${myColor}`;
                    newBtn.style.background   = `radial-gradient(circle, ${myColorHex}0.15) 0%, rgba(0,0,0,0.7) 70%)`;
                    newBtn.style.boxShadow    = `0 0 40px ${myColorHex}0.2), inset 0 0 40px rgba(0,0,0,0.5)`;

                    const ev = 'ontouchstart' in window ? 'touchstart' : 'click';
                    newBtn.addEventListener(ev, e => { e.preventDefault(); handleDuelTap(); });
                }

                runDuelCountdown();
            });
            // NOTE: tap button rebind is now inside the promise above — do NOT rebind here
        }

        function runDuelCountdown() {
            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer countdown';
            let count = 3;
            timerEl.innerText = count;
            playBeep('count', count);
            const cdInterval = setInterval(() => {
                count--;
                if (count > 0) { timerEl.innerText = count; playBeep('count', count); }
                else { clearInterval(cdInterval); startDuelGameplay(); }
            }, 1000);
        }

        function startDuelGameplay() {
            duelState = 'playing';
            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer go';
            timerEl.innerText = 'GO!';
            playBeep('go');
            duelPendingTaps  = 0;
            duelFlushInterval = setInterval(flushDuelTaps, 300);
            let timeLeft = DUEL_DURATION;
            setTimeout(() => {
                timerEl.className = 'duel-timer';
                timerEl.innerText = timeLeft;
                duelGameInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 3) timerEl.className = 'duel-timer countdown';
                    if (timeLeft <= 0) { clearInterval(duelGameInterval); endDuel(); }
                }, 1000);
            }, 800);
        }

        function handleDuelTap() {
            if (duelState !== 'playing') return;
            duelPendingTaps++;
            const btn = document.getElementById('duel-tap-btn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);
        }

        function flushDuelTaps() {
            if (duelPendingTaps > 0 && duelRoomCode && duelMyName) {
                const c = duelPendingTaps; duelPendingTaps = 0;
                db.ref(`duels/${duelRoomCode}/scores/${duelMyName}`).transaction(cur => (cur || 0) + c);
            }
        }

        function endDuel() {
            duelState = 'finished';
            clearInterval(duelFlushInterval);
            clearInterval(duelGameInterval);
            flushDuelTaps(); // Final flush

            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer';
            timerEl.innerText = '0';
            timerEl.style.color = '#555';
            document.getElementById('duel-tap-container').style.display = 'none';

            setTimeout(() => {
                db.ref(`duels/${duelRoomCode}/scores`).once('value').then(snap => {
                    const scores = snap.val() || {};
                    let maxScore = -1, roundWinner = null;
                    Object.entries(scores).forEach(([name, score]) => {
                        if (score > maxScore) { maxScore = score; roundWinner = name; }
                    });

                    const vals = Object.values(scores);
                    const isTie = vals.length === 2 && vals[0] === vals[1];

                    if (isTie) {
                        showDuelRoundFlash(null, duelCurrentRound);
                        return;
                    }

                    // Award round win
                    const newWins = (duelRoundWins[roundWinner] || 0) + 1;
                    duelRoundWins[roundWinner] = newWins;

                    // Only the non-spectator writes (prevents double-write)
                    if (!duelIsSpectator) {
                        db.ref(`duels/${duelRoomCode}/roundWins/${roundWinner}`).set(newWins);
                    }

                    if (newWins >= duelRoundsToWin) {
                        showDuelMatchResult(roundWinner);
                    } else {
                        duelCurrentRound++;
                        showDuelRoundFlash(roundWinner, duelCurrentRound - 1);
                    }
                });
            }, 500);
        }

        function showDuelRoundFlash(winner, roundNum) {
            const flashEl = document.getElementById('duel-round-flash');
            if (!winner) {
                flashEl.innerHTML = `
                    <div class="duel-round-flash-title">ROUND ${roundNum}</div>
                    <div class="duel-round-flash-name" style="color:var(--yellow)">DRAW!</div>
                    <div class="duel-round-flash-sub">REPLAYING ROUND...</div>`;
            } else {
                const idx   = duelPlayerNames.indexOf(winner);
                const color = idx === 0 ? 'var(--purple)' : 'var(--pink)';
                flashEl.innerHTML = `
                    <div class="duel-round-flash-title">ROUND ${roundNum}</div>
                    <div class="duel-round-flash-name" style="color:${color}">${winner} WINS</div>
                    <div class="duel-round-flash-sub">NEXT ROUND STARTING...</div>`;
            }

            flashEl.classList.remove('hidden');
            playBeep('win');

            // Only the designated round driver triggers the next round.
            // We check Firebase to confirm, avoiding the race where both
            // non-spectator players both call startNextRound().
            setTimeout(() => {
                flashEl.classList.add('hidden');
                if (!duelIsSpectator) {
                    db.ref(`duels/${duelRoomCode}/roundDriver`).once('value').then(snap => {
                        if (snap.val() === duelMyName) {
                            startNextRound();
                        }
                        // The non-driver just waits — roundCounter listener will fire for them too
                    });
                }
            }, 2500);
        }

        function showDuelMatchResult(winner) {
            const resultEl    = document.getElementById('duel-result');
            const winnerNameEl= document.getElementById('duel-winner-name');
            const titleEl     = document.querySelector('.duel-result-title');
            resultEl.classList.remove('hidden');
            winnerNameEl.innerText = winner;
            const idx = duelPlayerNames.indexOf(winner);
            winnerNameEl.style.color = idx === 0 ? 'var(--purple)' : 'var(--pink)';
            if (titleEl) titleEl.innerText = 'MATCH WINNER';
            playBeep('win');
            db.ref(`duels/${duelRoomCode}/status`).set('finished');
        }

        function updateDuelRoundUI() {
            const headerEl = document.getElementById('duel-round-header');
            if (duelMaxRounds === 1) { if (headerEl) headerEl.style.display = 'none'; return; }
            if (headerEl) headerEl.style.display = '';
            const roundLabel = document.getElementById('duel-round-label');
            if (roundLabel) roundLabel.innerText = `ROUND ${duelCurrentRound} OF ${duelMaxRounds}`;
            const starsContainer = document.getElementById('duel-round-stars');
            if (!starsContainer || duelPlayerNames.length < 2) return;
            starsContainer.innerHTML = duelPlayerNames.map((name, i) => {
                const color = i === 0 ? 'var(--purple)' : 'var(--pink)';
                const wins  = duelRoundWins[name] || 0;
                let stars   = '';
                for (let s = 0; s < duelRoundsToWin; s++) {
                    stars += `<span class="duel-star ${s < wins ? 'won' : ''}" style="color:${color}">★</span>`;
                }
                const displayName = name.length > 7 ? name.substring(0, 7) : name;
                return `<div class="duel-star-group"><span class="duel-star-name" style="color:${color}">${displayName}</span><div class="duel-stars">${stars}</div></div>`;
            }).join('<span style="color:#222;font-size:1rem;padding:0 8px;">vs</span>');
        }

        function rematchDuel() {
            if (!duelRoomCode) return;
            document.getElementById('duel-result').classList.add('hidden');
            document.getElementById('duel-round-flash').classList.add('hidden');
            document.getElementById('duel-timer').style.color = '';
            duelRoundWins    = {};
            duelCurrentRound = 1;
            duelLastRoundCounter = 0; // Reset so the next increment triggers entry
            // Whoever hits rematch becomes the new round driver
            db.ref(`duels/${duelRoomCode}/roundDriver`).set(duelMyName);
            startDuel();
        }

        function exitDuel() {
            duelListeners.forEach(l => l.ref.off(l.event, l.fn));
            duelListeners = [];
            clearInterval(duelFlushInterval);
            clearInterval(duelGameInterval);
            if (!duelIsSpectator && duelRoomCode && duelMyName) {
                db.ref(`duels/${duelRoomCode}/players/${duelMyName}`).remove();
                db.ref(`duels/${duelRoomCode}/scores/${duelMyName}`).remove();
                db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                    if (!snap.val() || Object.keys(snap.val()).length === 0) {
                        db.ref(`duels/${duelRoomCode}`).remove();
                    }
                });
            }
            duelRoomCode  = null; duelMyName = null; duelIsSpectator = false;
            duelState     = 'idle'; duelPendingTaps = 0;
            duelRoundWins = {}; duelCurrentRound = 1; duelPlayerNames = [];
            duelLastRoundCounter = 0;
            document.getElementById('duel-screen').classList.add('hidden');
            document.getElementById('setup').classList.remove('hidden');
        }

        // Expose duel functions
        window.showDuelLobby  = showDuelLobby;
        window.createDuelRoom = createDuelRoom;
        window.joinDuelRoom   = joinDuelRoom;
        window.showJoinInput  = showJoinInput;
        window.showWatchInput = showWatchInput;
        window.watchDuelRoom  = watchDuelRoom;
        window.startDuel      = startDuel;
        window.startNextRound = startNextRound;
        window.rematchDuel    = rematchDuel;
        window.exitDuel       = exitDuel;
    </script>
</body>
</html>
