        // --- AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(type, val) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'count') {
                osc.type = 'sawtooth';
                const num = val || 5;
                const step = 5 - num;
                const freq = 220 + (step * 55);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'go') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const oscW = audioCtx.createOscillator();
                    const gainW = audioCtx.createGain();
                    oscW.connect(gainW);
                    gainW.connect(audioCtx.destination);
                    oscW.type = 'triangle';
                    oscW.frequency.value = freq;
                    gainW.gain.setValueAtTime(0, now + (i * 0.1));
                    gainW.gain.linearRampToValueAtTime(0.3, now + (i * 0.1) + 0.05);
                    gainW.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.4);
                    oscW.start(now + (i * 0.1));
                    oscW.stop(now + (i * 0.1) + 0.5);
                });
            }
        }

        let isClientInitialized = false;

        function joinGame(teamId) {
            const btn = document.getElementById(`btn-select-${teamId}`);
            if (btn && btn.classList.contains('disabled-team')) return;

            // Auto-activate team for the host
            db.ref(`game/activeTeams/${teamId}`).set(true);

            myTeam = teamId;
            document.getElementById('setup').classList.add('hidden');
            const clientScreen = document.getElementById('client');
            clientScreen.classList.remove('hidden');

            const teamObj = teams.find(t => t.id === teamId);
            const colorVar = `var(--${teamObj.color})`;

            const btnTap = document.getElementById('tap-btn');
            const btnPractice = document.getElementById('practice-btn');
            const msg = document.getElementById('msg');
            btnTap.style.color = colorVar;
            btnPractice.style.color = colorVar;
            msg.style.color = colorVar;

            if (!isClientInitialized) {
                isClientInitialized = true;

                db.ref('game/status').on('value', snap => {
                    const status = snap.val();
                    if (status === 'playing') {
                        clientScreen.classList.remove('locked');
                        msg.innerText = "ENGAGED";
                        document.getElementById('tps-display').classList.add('hidden'); // Hide TPS
                        tapTimestamps = []; // Reset TPS on start
                        if (navigator.vibrate) navigator.vibrate(50);
                    } else {
                        clientScreen.classList.add('locked');
                        msg.innerText = "STANDBY";
                        document.getElementById('tps-display').classList.remove('hidden'); // Show TPS
                    }
                });

                const eventType = 'ontouchstart' in window ? 'touchstart' : 'click';
                btnTap.addEventListener(eventType, (e) => {
                    e.preventDefault();
                    handleTap();
                });
                btnPractice.addEventListener(eventType, (e) => {
                    e.preventDefault();
                    handlePracticeTap();
                });

                setInterval(flushPendingTaps, 300);

                // TPS Decay Interval (runs on client)
                setInterval(() => {
                    if (document.getElementById('client').classList.contains('hidden')) return;
                    const now = Date.now();
                    // Filter taps older than 1s
                    tapTimestamps = tapTimestamps.filter(t => now - t <= 1000);
                    // Update display if visible
                    const tpsDisplay = document.getElementById('tps-display');
                    if (!tpsDisplay.classList.contains('hidden')) {
                        tpsDisplay.innerText = tapTimestamps.length + " TPS";
                    }
                }, 100);
            }
        }

        let tapTimestamps = [];

        function handleTap() {
            if (document.getElementById('client').classList.contains('locked')) return;

            // TPS LOGIC
            tapTimestamps.push(Date.now());

            // GAMEPLAY LOGIC
            pendingTaps++;
            const btn = document.getElementById('tap-btn');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 50);
        }

        function handlePracticeTap() {
            // TPS LOGIC ONLY
            tapTimestamps.push(Date.now());

            const btn = document.getElementById('practice-btn');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 50);
        }

        function flushPendingTaps() {
            if (pendingTaps > 0) {
                const countToSend = pendingTaps;
                pendingTaps = 0;
                if (myTeam) {
                    db.ref(`scores/${myTeam}`).transaction(current => (current || 0) + countToSend);
                }
            }
        }

        // Function to show the setup screen (visual hint for match-setup)
        function showSetup() {
            document.getElementById('setup').classList.remove('hidden');
            document.getElementById('host').classList.add('hidden');
            document.getElementById('client').classList.add('hidden');
            document.getElementById('bracket-screen').classList.add('hidden');
        }

        function exitClient() {
            // Nullify the team and return to setup screen
            myTeam = null;
            showSetup();
        }

        window.onload = function () {
            showSetup();
            // HUD Toggle Listener
            document.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    document.body.classList.toggle('immersive');
                }
            });
        };

        function initHost() {
            isHost = true;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('host').classList.remove('hidden');
            initAudio();

            const board = document.getElementById('scoreboard');
            board.innerHTML = '<div class="vs-watermark">VS</div>';
            teams.forEach(t => {
                board.innerHTML += `
<div class="lane" id="lane-${t.id}" style="z-index:1;">
    <div class="lane-info">
        <div class="lane-label" style="color:var(--${t.color})">${t.name}</div>
        <div style="font-size:0.5rem; color:#555; letter-spacing:2px; margin-bottom:2px;">BEST OF 3</div>
        <div class="win-dots" id="dots-${t.id}">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div class="track">
        <div id="bar-${t.id}" class="bar bg-${t.id}"></div>
        <div id="score-${t.id}" class="score-text">0</div>
    </div>
</div>
`;
            });

            updateActiveTeams();

            teams.forEach(t => {
                db.ref(`scores/${t.id}`).on('value', snap => {
                    const score = snap.val() || 0;
                    currentScores[t.id] = score;
                    const percent = Math.min((score / winningScore) * 100, 100);
                    document.getElementById(`bar-${t.id}`).style.width = `${percent}%`;
                    document.getElementById(`score-${t.id}`).innerText = score;
                });
            });

            // --- NEW: LISTEN FOR WINS ---
            db.ref('wins').on('value', snap => {
                const winsData = snap.val() || {};
                teams.forEach(t => {
                    teamWins[t.id] = winsData[t.id] || 0;
                    updateDots(t.id);
                });
            });

            db.ref('game/status').on('value', snap => {
                const status = snap.val();
                const badge = document.getElementById('host-status');
                if (status === 'playing') {
                    badge.innerText = "SYSTEM ACTIVE";
                    badge.classList.add('active');
                } else {
                    badge.innerText = "SYSTEM IDLE";
                    badge.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                if (e.code === 'Space') startSequence();
                if (e.code === 'KeyR') resetScores();
            });
        }

        function updateActiveTeams() {
            if (!isHost) return;
            const updates = {};
            teams.forEach(t => {
                const isChecked = document.getElementById(`chk-${t.id}`).checked;
                updates[`game/activeTeams/${t.id}`] = isChecked;
                const lane = document.getElementById(`lane-${t.id}`);
                if (lane) {
                    if (isChecked) lane.classList.remove('inactive');
                    else lane.classList.add('inactive');
                }
            });
            db.ref().update(updates);
        }

        function determineWinner() {
            let maxScore = -1;
            let winningTeamId = null;
            teams.forEach(t => {
                const isChecked = document.getElementById(`chk-${t.id}`).checked;
                if (isChecked) {
                    const s = currentScores[t.id];
                    if (s > maxScore) { maxScore = s; winningTeamId = t.id; }
                }
            });

            if (winningTeamId && maxScore > 0) {
                // UPDATE FIREBASE INSTEAD OF LOCAL ONLY
                const newWins = (teamWins[winningTeamId] || 0) + 1;
                db.ref(`wins/${winningTeamId}`).set(newWins);

                const isDirector = document.getElementById('chk-auto-director') ? document.getElementById('chk-auto-director').checked : false;
                const winThreshold = isDirector ? targetWins : 2;

                const isMatchWin = newWins >= winThreshold;

                if (isMatchWin && isDirector) {
                    directorHandleWin(winningTeamId);
                }

                showWinnerOverlay(winningTeamId, isMatchWin);
            }
        }

        function updateDots(teamId) {
            const dotsContainer = document.getElementById(`dots-${teamId}`);
            if (!dotsContainer) return;
            const dots = dotsContainer.querySelectorAll('.dot');
            const wins = teamWins[teamId];
            for (let i = 0; i < dots.length; i++) {
                if (i < wins) dots[i].classList.add('active'); else
                    dots[i].classList.remove('active');
            }
        } function showWinnerOverlay(teamId, isMatchWin) {
            const team = teams.find(t =>
                t.id === teamId);
            if (!team) return;
            const overlay = document.getElementById('winner-overlay');
            const titleText = document.getElementById('winner-title-text');
            const nameText = document.getElementById('winner-name-text');
            const trophy = document.getElementById('winner-trophy');

            if (isMatchWin) {
                titleText.innerText = "MATCH WINNER";
                titleText.style.color = "#fff";
            } else {
                titleText.innerText = "ROUND WINNER";
                titleText.style.color = "#888";
            }
            nameText.innerText = team.name;
            nameText.style.color = `var(--${team.color})`;
            trophy.style.color = `var(--${team.color})`;
            playBeep('win');
            overlay.classList.remove('hidden');
        }

        function closeWinner() { document.getElementById('winner-overlay').classList.add('hidden'); }

        function setLights(state) {
            const lights = document.querySelectorAll('.light');
            const container = document.getElementById('race-lights');
            if (state === 0) {
                lights.forEach(l => l.classList.remove('active'));
                container.classList.remove('go-signal');
            } else if (state === -1) { container.classList.add('go-signal'); }
        }

        function startSequence() {
            if (!isHost || isSequenceRunning) return;
            resetScores(true);
            closeWinner();
            isSequenceRunning = true;
            setLights(0);
            let count = 5;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.style.color = 'var(--yellow)';
            runCountdownBeat(count);
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) runCountdownBeat(count);
                else { clearInterval(countdownInterval); startGameplay(); }
            }, 1000);
        }

        function runCountdownBeat(num) {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = num;
            playBeep('count', num);
            const lightIndex = 5 - num + 1;
            const light = document.getElementById(`light-${lightIndex}`);
            if (light) light.classList.add('active');
        }

        function startGameplay() {
            let timeLeft = ROUND_DURATION;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.style.color = 'var(--green)';
            timerDisplay.innerText = "GO";
            setLights(-1);
            playBeep('go');
            db.ref('game/status').set('playing');
            setTimeout(() => {
                timerDisplay.style.color = '#fff';
                timerDisplay.innerText = timeLeft;
                setLights(0);
                gameInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if (timeLeft <= 0) { clearInterval(gameInterval); endRound(); }
                }, 1000);
            }, 1000);
        } function endRound() {
            db.ref('game/status').set('paused'); isSequenceRunning = false;
            document.getElementById('timer-display').style.color = '#555';
            document.getElementById('timer-display').innerText = "0"; determineWinner();
        }

        function resetScores(force) {
            if (!isHost) return;
            if (!force && !confirm("Reset current scores? (Dots/Wins will remain)")) return;

            closeWinner();
            clearInterval(gameInterval);
            clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => updates[`scores/${t.id}`] = 0);
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }

        function resetMatch(force) {
            if (!isHost) return;
            if (!force && !confirm("NEW MATCH? This will clear ALL scores and Win Dots.")) return;
            closeWinner();
            clearInterval(gameInterval);
            clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => {
                updates[`scores/${t.id}`] = 0;
                updates[`wins/${t.id}`] = 0; // Clear wins in Firebase
            });
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }

        // --- TOURNAMENT DIRECTOR ---
        const bracketMatches = [
            { id: 'q1', inputs: ['b-q1-a', 'b-q1-b'], target: 'b-s1-a', bestOf: 3 },
            { id: 'q2', inputs: ['b-q2-a', 'b-q2-b'], target: 'b-s1-b', bestOf: 3 },
            { id: 'q3', inputs: ['b-q3-a', 'b-q3-b'], target: 'b-s2-a', bestOf: 3 },
            { id: 'q4', inputs: ['b-q4-a', 'b-q4-b'], target: 'b-s2-b', bestOf: 3 },
            { id: 's1', inputs: ['b-s1-a', 'b-s1-b'], target: 'b-f1-a', bestOf: 3 },
            { id: 's2', inputs: ['b-s2-a', 'b-s2-b'], target: 'b-f1-b', bestOf: 3 },
            { id: 'f1', inputs: ['b-f1-a', 'b-f1-b'], target: 'b-winner', bestOf: 5 }
        ];

        let currentDirectorMatch = null;
        let targetWins = 2;

        function evaluateBracketState() {
            const el = document.getElementById('chk-auto-director');
            const isAuto = el ? el.checked : false;

            if (!isAuto) {
                targetWins = 2;
                return;
            }

            let foundMatch = null;

            // Find first incomplete match
            for (const match of bracketMatches) {
                const valA = document.getElementById(match.inputs[0]).value;
                const valB = document.getElementById(match.inputs[1]).value;
                const valTarget = document.getElementById(match.target).value;

                // Priority: Handle BYE auto-advance immediately
                if (valA && valB && !valTarget) {
                    if (valA === "BYE" && valB !== "BYE") {
                        saveBracket(match.target, valB);
                        setTimeout(evaluateBracketState, 500);
                        return; // Stop and re-evaluate
                    } else if (valB === "BYE" && valA !== "BYE") {
                        saveBracket(match.target, valA);
                        setTimeout(evaluateBracketState, 500);
                        return; // Stop and re-evaluate
                    }
                }

                // Identify playable match
                if (!foundMatch && valA && valB && valA !== "BYE" && valB !== "BYE" && !valTarget) {
                    foundMatch = match;
                    // We DO NOT break here, because a later match might need BYE processing
                }
            }

            if (foundMatch) {
                activateMatch(foundMatch);
            }
        }

        function activateMatch(match) {
            currentDirectorMatch = match;
            targetWins = Math.ceil(match.bestOf / 2);

            const teamNameA = document.getElementById(match.inputs[0]).value;
            const teamNameB = document.getElementById(match.inputs[1]).value;

            // Identify Team IDs
            let idA = null, idB = null;
            teams.forEach(t => {
                if (t.name === teamNameA) idA = t.id;
                if (t.name === teamNameB) idB = t.id;
            });

            if (idA && idB) {
                // Ensure correct boxes are checked
                let needsUpdate = false;

                // Uncheck others
                calculateActive:
                teams.forEach(t => {
                    const chk = document.getElementById(`chk-${t.id}`);
                    const shouldBeChecked = (t.id === idA || t.id === idB);
                    if (chk.checked !== shouldBeChecked) {
                        chk.checked = shouldBeChecked;
                        needsUpdate = true;
                    }
                });

                if (needsUpdate) {
                    console.log(`Director: Activating ${match.id} (${teamNameA} vs ${teamNameB})`);
                    updateActiveTeams();
                    // Optional: Reset match if we just switched to it? 
                    // Let's rely on manual "New Match" for now, or users hits Reset Scores.
                    // Actually, if we switch matches, we MUST reset dots/scores or they persist from prev match.
                    // Let's force a match reset.
                    // Let's force a match reset.
                    resetMatch(true);
                }
            }
        }



        function directorHandleWin(winningTeamId) {
            if (!currentDirectorMatch) return;
            const winningTeam = teams.find(t => t.id === winningTeamId);
            if (!winningTeam) return;

            // Advance Bracket
            saveBracket(currentDirectorMatch.target, winningTeam.name);

            // Re-evaluate to find next match
            setTimeout(() => {
                evaluateBracketState();
            }, 2000);
        }

        function exitHost() {
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function confirmExit() {
            closeConfirm();
            isHost = false;
            document.getElementById('setup').classList.remove('hidden');
            document.getElementById('host').classList.add('hidden');
            // Stop game loop/audio
            clearInterval(gameInterval);
            clearInterval(countdownInterval);
        }



        // --- PIN SYSTEM ---
        function showPinModal() {
            document.getElementById('pin-modal').classList.remove('hidden');
            const input = document.getElementById('pin-input');
            input.value = "";
            input.focus();
            document.getElementById('pin-error').innerText = "";
        }

        function closePin() {
            document.getElementById('pin-modal').classList.add('hidden');
        }

        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === "120126") {
                closePin();
                initHost();
            } else {
                const errorLine = document.getElementById('pin-error');
                errorLine.innerText = "ACCESS DENIED";
                const modalBox = document.querySelector('#pin-modal .pin-box');
                modalBox.classList.add('shake');
                setTimeout(() => modalBox.classList.remove('shake'), 500);
            }
        }

        function checkPinEnter(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                checkPin();
            }
        }

        // ============================================
        // === 1v1 PRACTICE DUEL MODE ===
        // ============================================
        const DUEL_DURATION = 10;
        const DUEL_WINNING_SCORE = 200; // for bar width calculation
        let duelRoomCode = null;
        let duelMyName = null;
        let duelListeners = [];
        let duelPendingTaps = 0;
        let duelFlushInterval = null;
        let duelGameInterval = null;
        let duelState = 'idle'; // idle, waiting, countdown, playing, finished

        function showDuelLobby() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('duel-screen').classList.remove('hidden');
            document.getElementById('duel-lobby').classList.remove('hidden');
            document.getElementById('duel-waiting').classList.add('hidden');
            document.getElementById('duel-arena').classList.add('hidden');
            document.getElementById('duel-error').innerText = '';
            document.getElementById('duel-join-row').classList.add('hidden');
            duelState = 'idle';
        }

        function showJoinInput() {
            const row = document.getElementById('duel-join-row');
            row.classList.remove('hidden');
            row.style.display = 'flex';
            document.getElementById('duel-code-input').focus();
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function createDuelRoom() {
            const name = document.getElementById('duel-name-input').value.trim().toUpperCase();
            if (!name) {
                document.getElementById('duel-error').innerText = 'ENTER YOUR NAME';
                return;
            }
            duelMyName = name;
            duelRoomCode = generateRoomCode();

            db.ref(`duels/${duelRoomCode}`).set({
                players: { [name]: true },
                scores: { [name]: 0 },
                status: 'waiting',
                created: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                showDuelWaiting();
                listenToDuelRoom();
            });
        }

        function joinDuelRoom() {
            const name = document.getElementById('duel-name-input').value.trim().toUpperCase();
            if (!name) {
                document.getElementById('duel-error').innerText = 'ENTER YOUR NAME';
                return;
            }
            const code = document.getElementById('duel-code-input').value.trim().toUpperCase();
            if (!code || code.length !== 4) {
                document.getElementById('duel-error').innerText = 'ENTER 4-CHAR CODE';
                return;
            }

            duelMyName = name;
            duelRoomCode = code;

            db.ref(`duels/${code}`).once('value').then(snap => {
                const data = snap.val();
                if (!data) {
                    document.getElementById('duel-error').innerText = 'ROOM NOT FOUND';
                    duelRoomCode = null;
                    return;
                }
                const players = data.players || {};
                const playerCount = Object.keys(players).length;
                if (playerCount >= 2) {
                    document.getElementById('duel-error').innerText = 'ROOM IS FULL';
                    duelRoomCode = null;
                    return;
                }
                if (players[name]) {
                    document.getElementById('duel-error').innerText = 'NAME TAKEN';
                    duelRoomCode = null;
                    return;
                }

                db.ref(`duels/${code}/players/${name}`).set(true);
                db.ref(`duels/${code}/scores/${name}`).set(0);
                showDuelWaiting();
                listenToDuelRoom();
            });
        }

        function showDuelWaiting() {
            document.getElementById('duel-lobby').classList.add('hidden');
            document.getElementById('duel-waiting').classList.remove('hidden');
            document.getElementById('duel-my-code').innerText = duelRoomCode;
            duelState = 'waiting';
        }

        function listenToDuelRoom() {
            // Listen for players
            const playersRef = db.ref(`duels/${duelRoomCode}/players`);
            const playersListener = playersRef.on('value', snap => {
                const players = snap.val() || {};
                const names = Object.keys(players);
                const listEl = document.getElementById('duel-players-list');
                listEl.innerHTML = '';
                names.forEach((n, i) => {
                    const tag = document.createElement('div');
                    tag.className = 'duel-player-tag' + (n !== duelMyName ? ' opponent' : '');
                    tag.innerText = n + (n === duelMyName ? ' (YOU)' : '');
                    listEl.appendChild(tag);
                });

                const statusText = document.getElementById('duel-status-text');
                const startBtn = document.getElementById('duel-start-btn');
                if (names.length >= 2) {
                    statusText.innerText = 'READY TO DUEL!';
                    statusText.style.color = 'var(--green)';
                    startBtn.style.display = 'block';
                } else {
                    statusText.innerText = 'WAITING FOR OPPONENT...';
                    statusText.style.color = '#555';
                    startBtn.style.display = 'none';
                }
            });
            duelListeners.push({ ref: playersRef, event: 'value', fn: playersListener });

            // Listen for status changes
            const statusRef = db.ref(`duels/${duelRoomCode}/status`);
            const statusListener = statusRef.on('value', snap => {
                const status = snap.val();
                if (status === 'countdown' && duelState !== 'countdown' && duelState !== 'playing') {
                    enterDuelArena();
                }
            });
            duelListeners.push({ ref: statusRef, event: 'value', fn: statusListener });
        }

        function startDuel() {
            if (!duelRoomCode) return;
            // Reset scores
            db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                const players = snap.val() || {};
                const scoreUpdates = {};
                Object.keys(players).forEach(n => scoreUpdates[n] = 0);
                db.ref(`duels/${duelRoomCode}/scores`).set(scoreUpdates);
                db.ref(`duels/${duelRoomCode}/winner`).remove();
                db.ref(`duels/${duelRoomCode}/status`).set('countdown');
            });
        }

        function enterDuelArena() {
            duelState = 'countdown';
            document.getElementById('duel-waiting').classList.add('hidden');
            document.getElementById('duel-arena').classList.remove('hidden');
            document.getElementById('duel-result').classList.add('hidden');
            document.getElementById('duel-tap-container').style.display = 'flex';
            document.getElementById('duel-tap-container').style.justifyContent = 'center';

            initAudio();

            // Build lanes
            db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                const players = Object.keys(snap.val() || {});
                const lanesEl = document.getElementById('duel-lanes');
                lanesEl.innerHTML = '';
                players.forEach((name, i) => {
                    const isMe = name === duelMyName;
                    const colorClass = i === 0 ? 'p1' : 'p2';
                    const color = i === 0 ? 'var(--purple)' : 'var(--pink)';
                    lanesEl.innerHTML += `
                        <div class="duel-lane">
                            <div class="duel-lane-header">
                                <span class="duel-lane-name" style="color:${color}">${name}${isMe ? ' ★' : ''}</span>
                                <span class="duel-lane-score" id="duel-score-${name}" style="color:${color}">0</span>
                            </div>
                            <div class="duel-track">
                                <div class="duel-bar ${colorClass}" id="duel-bar-${name}"></div>
                            </div>
                        </div>
                    `;
                });

                // Listen for score changes
                const scoresRef = db.ref(`duels/${duelRoomCode}/scores`);
                const scoresListener = scoresRef.on('value', snap => {
                    const scores = snap.val() || {};
                    Object.entries(scores).forEach(([name, score]) => {
                        const scoreEl = document.getElementById(`duel-score-${name}`);
                        const barEl = document.getElementById(`duel-bar-${name}`);
                        if (scoreEl) scoreEl.innerText = score;
                        if (barEl) barEl.style.width = Math.min((score / DUEL_WINNING_SCORE) * 100, 100) + '%';
                    });
                });
                duelListeners.push({ ref: scoresRef, event: 'value', fn: scoresListener });

                // Start countdown
                runDuelCountdown();
            });

            // Setup tap handler
            const tapBtn = document.getElementById('duel-tap-btn');
            const eventType = 'ontouchstart' in window ? 'touchstart' : 'click';
            // Remove old listener first
            tapBtn.replaceWith(tapBtn.cloneNode(true));
            const newTapBtn = document.getElementById('duel-tap-btn');
            newTapBtn.addEventListener(eventType, (e) => {
                e.preventDefault();
                handleDuelTap();
            });
        }

        function runDuelCountdown() {
            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer countdown';
            let count = 3;
            timerEl.innerText = count;
            playBeep('count', count);

            const cdInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timerEl.innerText = count;
                    playBeep('count', count);
                } else {
                    clearInterval(cdInterval);
                    startDuelGameplay();
                }
            }, 1000);
        }

        function startDuelGameplay() {
            duelState = 'playing';
            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer go';
            timerEl.innerText = 'GO!';
            playBeep('go');

            duelPendingTaps = 0;
            duelFlushInterval = setInterval(flushDuelTaps, 300);

            let timeLeft = DUEL_DURATION;
            setTimeout(() => {
                timerEl.className = 'duel-timer';
                timerEl.innerText = timeLeft;

                duelGameInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 3) timerEl.className = 'duel-timer countdown';
                    if (timeLeft <= 0) {
                        clearInterval(duelGameInterval);
                        endDuel();
                    }
                }, 1000);
            }, 800);
        }

        function handleDuelTap() {
            if (duelState !== 'playing') return;
            duelPendingTaps++;
            const btn = document.getElementById('duel-tap-btn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);
        }

        function flushDuelTaps() {
            if (duelPendingTaps > 0 && duelRoomCode && duelMyName) {
                const count = duelPendingTaps;
                duelPendingTaps = 0;
                db.ref(`duels/${duelRoomCode}/scores/${duelMyName}`).transaction(c => (c || 0) + count);
            }
        }

        function endDuel() {
            duelState = 'finished';
            clearInterval(duelFlushInterval);
            clearInterval(duelGameInterval);

            // Final flush
            flushDuelTaps();

            const timerEl = document.getElementById('duel-timer');
            timerEl.className = 'duel-timer';
            timerEl.innerText = '0';
            timerEl.style.color = '#555';

            document.getElementById('duel-tap-container').style.display = 'none';

            // Determine winner from current displayed scores
            setTimeout(() => {
                db.ref(`duels/${duelRoomCode}/scores`).once('value').then(snap => {
                    const scores = snap.val() || {};
                    let maxScore = -1;
                    let winner = 'TIE';
                    Object.entries(scores).forEach(([name, score]) => {
                        if (score > maxScore) {
                            maxScore = score;
                            winner = name;
                        }
                    });

                    // Check for tie
                    const scoreValues = Object.values(scores);
                    if (scoreValues.length === 2 && scoreValues[0] === scoreValues[1]) {
                        winner = 'TIE!';
                    }

                    const resultEl = document.getElementById('duel-result');
                    const winnerNameEl = document.getElementById('duel-winner-name');
                    resultEl.classList.remove('hidden');
                    winnerNameEl.innerText = winner;

                    if (winner === 'TIE!') {
                        winnerNameEl.style.color = 'var(--yellow)';
                        document.querySelector('.duel-result-title').innerText = 'DRAW';
                    } else {
                        // Find index of winner for color
                        const playerNames = Object.keys(scores);
                        const winnerIdx = playerNames.indexOf(winner);
                        winnerNameEl.style.color = winnerIdx === 0 ? 'var(--purple)' : 'var(--pink)';
                        document.querySelector('.duel-result-title').innerText = 'WINNER';
                    }

                    playBeep('win');
                    db.ref(`duels/${duelRoomCode}/status`).set('finished');
                });
            }, 500);
        }

        function rematchDuel() {
            if (!duelRoomCode) return;
            document.getElementById('duel-result').classList.add('hidden');
            document.getElementById('duel-timer').style.color = '';
            startDuel();
        }

        function exitDuel() {
            // Clean up listeners
            duelListeners.forEach(l => l.ref.off(l.event, l.fn));
            duelListeners = [];
            clearInterval(duelFlushInterval);
            clearInterval(duelGameInterval);

            // Remove self from room
            if (duelRoomCode && duelMyName) {
                db.ref(`duels/${duelRoomCode}/players/${duelMyName}`).remove();
                db.ref(`duels/${duelRoomCode}/scores/${duelMyName}`).remove();
                // Check if room is now empty and delete
                db.ref(`duels/${duelRoomCode}/players`).once('value').then(snap => {
                    if (!snap.val() || Object.keys(snap.val()).length === 0) {
                        db.ref(`duels/${duelRoomCode}`).remove();
                    }
                });
            }

            duelRoomCode = null;
            duelMyName = null;
            duelState = 'idle';
            duelPendingTaps = 0;

            document.getElementById('duel-screen').classList.add('hidden');
            document.getElementById('setup').classList.remove('hidden');
        }

        // Expose duel functions
        window.showDuelLobby = showDuelLobby;
        window.createDuelRoom = createDuelRoom;
        window.joinDuelRoom = joinDuelRoom;
        window.showJoinInput = showJoinInput;
        window.startDuel = startDuel;
        window.rematchDuel = rematchDuel;
        window.exitDuel = exitDuel;
    </script>
    <style>
        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</body>

</html>
