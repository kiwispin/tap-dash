<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Dash: School Edition</title>
    <!-- Import Futuristic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- NEON THEME VARIABLES --- */
        :root {
            --bg-color: #050510;
            --text-main: #fff;

            /* NEON PALETTE */
            --cyan: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.3);
            --cyan-glow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;

            /* NEW SCHOOL COLORS */
            --pink: #ff00cc;
            --yellow: #fff01f;
            --orange: #ffaa00;
            --green: #39ff14;
            --blue: #00f3ff;
            --white: #ffffff;
            --purple: #9d00ff;
        }

        /* --- GLOBAL & ANIMATION --- */
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            touch-action: manipulation;
        }

        /* Moving Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            perspective: 500px;
            transform-style: preserve-3d;
        }

        .grid-bg::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(5, 5, 16, 1) 0%, rgba(5, 5, 16, 0) 20%);
        }

        .hidden {
            display: none !important;
        }

        .screen {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BUTTON STYLES --- */
        button {
            cursor: pointer;
            transition: all 0.2s ease-out;
            font-family: 'Orbitron', sans-serif;
        }

        /* Team Selection Buttons */
        .btn-grid button {
            position: relative;
            flex: 1 1 200px;
            max-width: 320px;
            height: 100px;
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 92% 100%, 0 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .btn-grid button:hover {
            transform: translateY(-5px) scale(1.02);
            z-index: 10;
        }

        .btn-grid button.disabled-team {
            opacity: 0.2;
            pointer-events: none;
            filter: grayscale(1);
            border-color: #444;
            background: rgba(0, 0, 0, 0.5);
        }

        .btn-aranui {
            border-color: var(--pink);
            background: rgba(255, 0, 204, 0.2) !important;
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.2), inset 0 0 20px rgba(255, 0, 204, 0.1);
        }

        .btn-aranui:hover {
            background: var(--pink) !important;
            color: #fff;
            box-shadow: 0 0 40px var(--pink);
        }

        .btn-tainui {
            border-color: var(--yellow);
            background: rgba(255, 240, 31, 0.2) !important;
            box-shadow: 0 0 15px rgba(255, 240, 31, 0.2), inset 0 0 20px rgba(255, 240, 31, 0.1);
            color: #fff;
        }

        .btn-tainui:hover {
            background: var(--yellow) !important;
            color: #000;
            box-shadow: 0 0 40px var(--yellow);
        }

        .btn-mahitahi {
            border-color: var(--orange);
            background: rgba(255, 170, 0, 0.2) !important;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2), inset 0 0 20px rgba(255, 170, 0, 0.1);
        }

        .btn-mahitahi:hover {
            background: var(--orange) !important;
            color: #fff;
            box-shadow: 0 0 40px var(--orange);
        }

        .btn-kiakaha {
            border-color: var(--green);
            background: rgba(57, 255, 20, 0.2) !important;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2), inset 0 0 20px rgba(57, 255, 20, 0.1);
        }

        .btn-kiakaha:hover {
            background: var(--green) !important;
            color: #000;
            box-shadow: 0 0 40px var(--green);
        }

        .btn-tearoha {
            border-color: var(--blue);
            background: rgba(0, 243, 255, 0.2) !important;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .btn-tearoha:hover {
            background: var(--blue) !important;
            color: #000;
            box-shadow: 0 0 40px var(--blue);
        }

        .btn-year9 {
            border-color: var(--white);
            background: rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-year9:hover {
            background: var(--white) !important;
            color: #000;
            box-shadow: 0 0 40px var(--white);
        }

        .btn-staff {
            border-color: var(--purple);
            background: rgba(157, 0, 255, 0.2) !important;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.2), inset 0 0 20px rgba(157, 0, 255, 0.1);
            color: #fff;
        }

        .btn-staff:hover {
            background: var(--purple) !important;
            color: #fff;
            box-shadow: 0 0 40px var(--purple);
        }

        /* --- SETUP SCREEN --- */
        #setup h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 30px var(--blue);
            margin-bottom: 30px;
            text-align: center;
            font-weight: 900;
        }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1000px;
            padding: 0 20px;
        }

        .btn-host {
            width: 100%;
            max-width: 300px;
            margin-top: 100px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            border: 1px solid #444;
            border-left: 1px solid #444;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.9rem;
            box-shadow: none;
            transition: all 0.3s;
        }

        .btn-host:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            text-shadow: none;
            border-color: #fff;
        }

        /* HUD Style Bracket Button */
        .btn-bracket-corner {
            position: absolute;
            top: 30px;
            right: 30px;
            width: auto;
            height: auto;
            flex: none;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--blue);
            color: var(--blue);
            font-family: 'Orbitron';
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.8rem;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .btn-bracket-corner:hover {
            background: var(--blue);
            color: #000;
            box-shadow: 0 0 30px var(--blue);
            transform: translateY(0) scale(1.05);
        }

        /* --- BRACKET REMASTER --- */
        #bracket-screen {
            background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .bracket-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            width: 100%;
            max-width: 1400px;
            height: 65vh;
            margin-top: 20px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            padding: 0 20px;
        }

        .round-final {
            justify-content: center;
        }

        .match-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            margin: 10px 0;
            padding: 10px 0;
        }

        .match {
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid #333;
            border-left: 2px solid var(--cyan);
            padding: 15px;
            position: relative;
            transition: all 0.3s;
            clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%, 0 15px);
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .match:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            background: rgba(0, 20, 40, 0.8);
        }

        .bracket-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: #fff;
            font-family: 'Orbitron';
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            padding: 5px 0;
            outline: none;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bracket-input:focus {
            border-bottom-color: var(--cyan);
            text-shadow: 0 0 5px var(--cyan);
        }

        .bracket-input::placeholder {
            color: #555;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        /* CONNECTORS */
        .connector-right {
            position: absolute;
            right: -21px;
            top: 50%;
            width: 21px;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
            z-index: 10;
        }

        .connector-left {
            position: absolute;
            left: -21px;
            top: 50%;
            width: 21px;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
            z-index: 10;
        }

        .two-into-one {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The "Fork" Logic for Semi-Finals */
        /* We need vertical lines connecting the QTR outputs to the SEMI inputs */
        /* Since we can't easily draw lines between parents in flexbox without SVG, 
           we will fake it by adding 'arms' to the semi-final match groups */

        .round-semi .match-group::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 25%;
            bottom: 25%;
            width: 2px;
            background: var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
        }

        .round-finals .match-group::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 25%;
            bottom: 25%;
            width: 2px;
            background: var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
        }

        /* Specialized connector for Boss Mode (Single input from top) */
        /* Specialized connector for Boss Mode (Single input from top) */
        .match-group.single-arm-top::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 15%;
            /* Higher start point to catch Q3 */
            bottom: 50%;
            /* Cuts off the bottom arm */
            width: 2px;
            background: var(--cyan);
            box-shadow: 0 0 5px var(--cyan);
            border-bottom-left-radius: 4px;
        }

        .match-group.single-arm-top .connector-left {
            top: 15%;
            /* Move the horizontal connector up to match Q3's likely position */
        }



        /* Adjust vertical line height for Semi round 1 and 2 roughly */
        /* This is a visual approximation. For pixel perfect, Grid would be better but CSS Grid drawing lines is also manual. */

        .match.final-match {
            border: 2px solid var(--gold);
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            transform: scale(1.1);
        }

        .final-label {
            color: var(--gold);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .bracket-input.champion {
            font-size: 1.5rem;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold);
            border-bottom: none;
        }

        .bracket-controls {
            margin-top: auto;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .bracket-header {
            font-size: 3rem;
            letter-spacing: 10px;
            margin-bottom: 20px;
            color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan);
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        /* --- HOST SCREEN --- */
        #host {
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            padding: 20px;
            box-sizing: border-box;
            justify-content: flex-start;
            overflow-y: auto;
        }

        /* Match Setup Panel */
        #match-setup {
            width: 90%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            padding: 8px 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            margin-top: 260px;
            /* Clear Timer AND Race Lights */
        }

        .setup-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #aaa;
            font-weight: bold;
        }

        .setup-checkbox:hover {
            color: #fff;
        }

        .setup-checkbox input {
            accent-color: var(--blue);
            width: 1.2em;
            height: 1.2em;
        }

        /* HUD Elements - RACE LIGHTS F1 STYLE */
        #race-lights {
            display: flex;
            gap: 20px;
            /* Absolute positioning to sit below the huge timer */
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 30px;
            border: 1px solid #333;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .light {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #151515;
            border: 2px solid #333;
            transition: all 0.05s;
        }

        .light.active {
            background: #ff0000;
            box-shadow: 0 0 30px #ff0000;
            border-color: #fff;
        }

        #race-lights.go-signal .light {
            background: #00ff00 !important;
            box-shadow: 0 0 50px #00ff00 !important;
            border-color: #fff;
            transform: scale(1.1);
        }

        .host-header {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            height: 0;
            /* Don't push content down */
            display: flex;
            justify-content: center;
            /* Timer Center */
            z-index: 10;
        }

        h1.host-title {
            position: absolute;
            left: 30px;
            top: 10px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            background: #e60000;
            /* LIVE RED */
            padding: 5px 15px;
            border-radius: 4px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px #ff0000;
            transform: skewX(-10deg);
        }

        #timer-display {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.5);
            padding: 0 30px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: none;
            backdrop-filter: blur(5px);
        }

        /* TRACKS */
        #scoreboard {
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 50px;
            position: relative;
            overflow: hidden;
            /* Ensure big VS doesn't scroll */
        }

        .vs-watermark {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 30vw;
            /* Reduced from 50vw */
            line-height: 0.8;
            font-weight: 900;
            font-style: italic;
            color: rgba(255, 255, 255, 0.03);
            /* More subtle */
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        /* IMMERSIVE MODE */
        body.immersive #match-setup,
        body.immersive #controls,
        body.immersive .immersive-hint {
            display: none !important;
        }

        body.immersive {
            cursor: none;
            /* Hide cursor for full immersion */
        }

        .lane {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Center horizontally */
            gap: 30px;
            height: 120px;
            flex-shrink: 0;
            position: relative;
            transition: opacity 0.3s;
            width: 100%;
            /* Ensure full width availability */
        }

        .lane.inactive {
            display: none;
        }

        .lane-info {
            width: 250px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .lane-label {
            font-weight: 800;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .win-dots {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            margin-right: 20px;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
        }

        .dot.active {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .track {
            flex-grow: 0;
            width: 70%;
            background: rgba(255, 255, 255, 0.05);
            height: 40px;
            border-radius: 4px;
            position: relative;
            overflow: visible;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            position: relative;
            box-shadow: 0 0 15px currentColor;
        }

        .bar::after {
            content: '';
            position: absolute;
            top: -6px;
            right: -10px;
            width: 30px;
            height: 52px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px #fff, 0 0 40px currentColor;
            transform: skewX(-20deg);
        }

        .score-text {
            position: absolute;
            right: -100px;
            top: -2px;
            font-size: 2.5rem;
            font-weight: 800;
            width: 80px;
            color: #fff;
            opacity: 1;
            text-shadow: 0 0 10px currentColor;
        }

        /* CONTROLS */
        #controls {
            height: 80px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 0 20px;
            border-top: 1px solid #333;
            box-sizing: border-box;
        }

        .status-badge,
        .control-btn {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .status-badge {
            background: #111;
            color: #555;
            border: 1px solid #333;
            min-width: 180px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            padding: 0 20px;
        }

        .status-badge.active {
            background: rgba(0, 255, 0, 0.1);
            color: var(--green);
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            text-shadow: 0 0 5px var(--green);
        }

        .control-btn {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 0 30px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 200px;
            font-family: 'Orbitron';
        }

        .control-btn:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .control-btn.primary {
            border-color: var(--blue);
            color: var(--blue);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .control-btn.primary:hover {
            background: var(--blue);
            color: #000;
            box-shadow: 0 0 20px var(--blue);
        }

        .control-btn.danger {
            border-color: var(--pink);
            color: var(--pink);
            opacity: 0.7;
        }

        .control-btn.danger:hover {
            opacity: 1;
            background: var(--pink);
            color: white;
            box-shadow: 0 0 20px var(--pink);
        }

        .control-btn.exit {
            border-color: var(--orange);
            color: var(--orange);
            margin-left: auto;
            box-shadow: inset 0 0 5px rgba(255, 170, 0, 0.2);
        }

        .control-btn.exit:hover {
            background: var(--orange);
            color: #000;
            box-shadow: 0 0 20px var(--orange);
        }


        /* --- WINNER OVERLAY --- */
        #winner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease-out;
        }

        .trophy-container {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px currentColor);
            animation: float 2s infinite ease-in-out;
        }

        .winner-title {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            margin: 0;
            letter-spacing: 5px;
        }

        .winner-name {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
            margin: 10px 0 40px 0;
            letter-spacing: 3px;
        }

        .winner-close-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 40px;
            font-family: 'Orbitron';
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .winner-close-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* --- CLIENT SCREEN --- */
        #client {
            text-align: center;
            position: relative;
            background: radial-gradient(circle, #222 0%, #000 100%);
        }

        #tap-btn,
        #practice-btn {
            width: 70vw;
            height: 70vw;
            max-width: 350px;
            max-height: 350px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0, 0, 0, 0.8);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 2;
        }

        #tap-btn::after,
        #practice-btn::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 4px solid currentColor;
            opacity: 0.5;
            box-shadow: 0 0 20px currentColor;
            animation: pulse 2s infinite;
        }

        #tap-btn:active,
        #practice-btn:active {
            transform: scale(0.96);
        }

        #tap-btn:active::after,
        #practice-btn:active::after {
            opacity: 1;
            box-shadow: 0 0 50px currentColor;
        }

        #client.locked {
            background: #000 !important;
        }

        #client.locked #tap-btn {
            display: none;
        }

        #client:not(.locked) #practice-btn {
            display: none;
        }

        /* --- CLIENT EXIT BUTTON --- */
        .btn-client-exit {
            position: absolute;
            top: 30px;
            left: 30px;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--orange);
            color: var(--orange);
            font-family: 'Orbitron';
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.8rem;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.1);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .btn-client-exit:hover {
            background: var(--orange);
            color: #000;
            box-shadow: 0 0 30px var(--orange);
            transform: translateY(0) scale(1.05);
        }

        #client:not(.locked) .btn-client-exit {
            display: none;
        }

        #msg {
            font-size: 3rem;
            margin-bottom: 40px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px currentColor;
            z-index: 2;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.02);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 0.5;
            }
        }

        /* --- PIN MODAL --- */
        #pin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .pin-box {
            background: #050510;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 243, 255, 0.1);
            padding: 40px;
            width: 300px;
            text-align: center;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            position: relative;
        }

        .pin-box::before {
            content: 'SECURITY CHECK';
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--cyan);
            opacity: 0.7;
        }

        .pin-display {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #fff;
            font-family: 'Orbitron';
            font-size: 2rem;
            letter-spacing: 8px;
            margin: 30px 0;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            outline: none;
        }

        .pin-display:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px var(--cyan-dim);
        }

        .pin-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-pin {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            font-family: 'Orbitron';
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pin:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-pin.confirm {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-pin.confirm:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 20px var(--cyan);
        }

        .pin-error {
            color: var(--pink);
            margin-top: 10px;
            min-height: 1.2em;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .tps-counter {
            font-family: 'Orbitron';
            color: #666;
            font-size: 1.2rem;
            margin: 20px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        /* --- 1v1 DUEL MODE --- */
        .btn-duel {
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
            height: 50px;
            background: linear-gradient(135deg, rgba(157, 0, 255, 0.2), rgba(255, 0, 204, 0.2));
            color: var(--purple);
            border: 1px solid var(--purple);
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.2);
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-duel:hover {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff;
            box-shadow: 0 0 30px var(--purple);
            transform: translateY(-2px);
            border-color: #fff;
        }

        #duel-screen {
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        .duel-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }

        .duel-lobby h2 {
            font-size: 1.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0;
            text-align: center;
        }

        .duel-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            color: #fff;
            font-family: 'Orbitron';
            font-size: 1rem;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .duel-input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.3);
        }

        .duel-input::placeholder {
            color: #444;
            letter-spacing: 3px;
        }

        .duel-btn-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .duel-action-btn {
            flex: 1;
            padding: 14px 10px;
            background: transparent;
            border: 2px solid var(--purple);
            color: var(--purple);
            font-family: 'Orbitron';
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .duel-action-btn:hover {
            background: var(--purple);
            color: #fff;
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.4);
        }

        .duel-action-btn.pink {
            border-color: var(--pink);
            color: var(--pink);
        }

        .duel-action-btn.pink:hover {
            background: var(--pink);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 204, 0.4);
        }

        .duel-room-display {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--purple);
            padding: 20px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.15);
        }

        .duel-room-code {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 12px;
            color: var(--purple);
            text-shadow: 0 0 20px var(--purple);
            margin: 10px 0;
        }

        .duel-room-label {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 4px;
        }

        .duel-waiting {
            color: #555;
            font-size: 0.85rem;
            letter-spacing: 3px;
            animation: duelPulse 1.5s infinite;
        }

        .duel-players {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .duel-player-tag {
            padding: 8px 15px;
            background: rgba(157, 0, 255, 0.1);
            border: 1px solid rgba(157, 0, 255, 0.3);
            color: var(--purple);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
        }

        .duel-player-tag.opponent {
            background: rgba(255, 0, 204, 0.1);
            border-color: rgba(255, 0, 204, 0.3);
            color: var(--pink);
        }

        @keyframes duelPulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* Duel Arena */
        .duel-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 20px;
        }

        .duel-timer {
            font-size: 6rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .duel-timer.countdown {
            color: var(--yellow);
            text-shadow: 0 0 30px var(--yellow);
        }

        .duel-timer.go {
            color: var(--green);
            text-shadow: 0 0 40px var(--green);
        }

        .duel-lanes {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .duel-lane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .duel-lane-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .duel-lane-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .duel-lane-score {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .duel-track {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .duel-bar {
            height: 100%;
            width: 0%;
            transition: width 0.2s ease-out;
            border-radius: 2px;
        }

        .duel-bar.p1 {
            background: linear-gradient(90deg, rgba(157, 0, 255, 0.6), var(--purple));
            box-shadow: 0 0 15px var(--purple);
        }

        .duel-bar.p2 {
            background: linear-gradient(90deg, rgba(255, 0, 204, 0.6), var(--pink));
            box-shadow: 0 0 15px var(--pink);
        }

        .duel-tap-zone {
            width: 60vw;
            height: 60vw;
            max-width: 280px;
            max-height: 280px;
            border-radius: 50%;
            border: 4px solid rgba(157, 0, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: var(--purple);
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 40px rgba(157, 0, 255, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
        }

        .duel-tap-zone:active {
            transform: scale(0.94);
        }

        .duel-tap-zone::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 3px solid var(--purple);
            opacity: 0.4;
            box-shadow: 0 0 20px var(--purple);
            animation: pulse 2s infinite;
        }

        .duel-result {
            text-align: center;
        }

        .duel-result-title {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .duel-result-name {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px currentColor;
        }

        .duel-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            color: #666;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
        }

        .duel-back-btn:hover {
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="grid-bg"></div>

    <!-- SETUP SCREEN -->
    <div id="setup" class="screen">
        <button class="btn-bracket-corner" onclick="showBracket()">TOURNAMENT BRACKET</button>

        <h1>Select Team</h1>
        <div class="btn-grid">
            <button id="btn-select-aranui" class="btn-aranui" onclick="joinGame('aranui')">Aranui</button>
            <button id="btn-select-tainui" class="btn-tainui" onclick="joinGame('tainui')">Tainui</button>
            <button id="btn-select-mahitahi" class="btn-mahitahi" onclick="joinGame('mahitahi')">Mahi Tahi</button>
            <button id="btn-select-kiakaha" class="btn-kiakaha" onclick="joinGame('kiakaha')">Kia Kaha</button>
            <button id="btn-select-tearoha" class="btn-tearoha" onclick="joinGame('tearoha')">Te Aroha</button>
            <button id="btn-select-year9" class="btn-year9" onclick="joinGame('year9')">YEAR 9</button>
            <button id="btn-select-staff" class="btn-staff" onclick="joinGame('staff')">STAFF</button>
        </div>
        <button class="btn-duel" onclick="showDuelLobby()">⚡ 1v1 PRACTICE DUEL</button>
        <button class="btn-host" onclick="showPinModal()">HOST CONTROLS</button>
    </div>

    <!-- PIN MODAL -->
    <div id="pin-modal" class="hidden">
        <div class="pin-box">
            <input type="password" id="pin-input" class="pin-display" maxlength="6" placeholder="PIN"
                onkeydown="checkPinEnter(event)">
            <div class="pin-controls">
                <button class="btn-pin" onclick="closePin()">CANCEL</button>
                <button class="btn-pin confirm" onclick="checkPin()">ACCESS</button>
            </div>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <!-- CONFIRM EXIT MODAL -->
    <div id="confirm-modal" class="hidden">
        <div class="pin-box" style="border-color: var(--pink); box-shadow: 0 0 20px var(--pink);">
            <div
                style="color: var(--pink); font-family: 'Orbitron'; font-size: 1.5rem; margin-bottom: 20px; text-shadow: 0 0 10px var(--pink);">
                TERMINATE SYSTEM?
            </div>
            <div class="pin-controls">
                <button class="btn-pin" onclick="closeConfirm()">CANCEL</button>
                <button class="btn-pin confirm" style="border-color: var(--pink); color: var(--pink);"
                    onclick="confirmExit()" onmouseover="this.style.background='var(--pink)'; this.style.color='#000'"
                    onmouseout="this.style.background='transparent'; this.style.color='var(--pink)'">
                    SHUT DOWN
                </button>
            </div>
        </div>
    </div>

    <!-- BRACKET SCREEN (REMASTERED) -->
    <div id="bracket-screen" class="screen hidden">
        <h1 class="bracket-header">TOURNAMENT BRACKET</h1>

        <div class="bracket-wrapper">
            <!-- Round 1: Quarter Finals -->
            <div class="round round-qtr">
                <div class="match-group">
                    <div class="match">
                        <input class="bracket-input" id="b-q1-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="TEAM 1">
                        <input class="bracket-input" id="b-q1-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="TEAM 2">
                        <div class="connector-right"></div>
                    </div>
                </div>
                <div class="match-group">
                    <div class="match">
                        <input class="bracket-input" id="b-q2-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="TEAM 3">
                        <input class="bracket-input" id="b-q2-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="TEAM 4">
                        <div class="connector-right"></div>
                    </div>
                </div>
                <div class="match-group">
                    <div class="match">
                        <input class="bracket-input" id="b-q3-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="TEAM 5">
                        <input class="bracket-input" id="b-q3-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="BYE">
                        <div class="connector-right"></div>
                    </div>
                </div>
                <div class="match-group">
                    <div class="match">
                        <input class="bracket-input" id="b-q4-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="BYE">
                        <input class="bracket-input" id="b-q4-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="BYE">
                        <div class="connector-right"></div>
                    </div>
                </div>
            </div>

            <!-- Round 2: Semi Finals -->
            <div class="round round-semi">
                <div class="match-group two-into-one">
                    <div class="connector-left"></div>
                    <div class="match single">
                        <input class="bracket-input" id="b-s1-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="WINNER Q1/Q2">
                        <input class="bracket-input" id="b-s1-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="WINNER Q3/Q4">
                        <div class="connector-right"></div>
                    </div>
                </div>
                <!-- Semi 2: Direct Feed from Q3 in 6-team mode -->
                <div class="match-group two-into-one">
                    <div class="connector-left"></div>
                    <div class="match single">
                        <input class="bracket-input" id="b-s2-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="WINNER Q5/Q6">
                        <input class="bracket-input" id="b-s2-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="WINNER Q7/Q8">
                        <div class="connector-right"></div>
                    </div>
                </div>
            </div>

            <!-- Round 3: Finals -->
            <div class="round round-finals">
                <div class="match-group two-into-one">
                    <div class="connector-left"></div>
                    <div class="match single">
                        <input class="bracket-input" id="b-f1-a" onchange="saveBracket(this.id, this.value)"
                            placeholder="FINALIST A">
                        <input class="bracket-input" id="b-f1-b" onchange="saveBracket(this.id, this.value)"
                            placeholder="FINALIST B">
                        <div class="connector-right"></div>
                    </div>
                </div>
            </div>

            <!-- Round 4: Champion -->
            <div class="round round-champion">
                <div class="match-group two-into-one">
                    <div class="connector-left"></div>
                    <div class="match final-match">
                        <div class="final-label">CHAMPION</div>
                        <input class="bracket-input champion" id="b-winner" onchange="saveBracket(this.id, this.value)"
                            placeholder="AWAITING DATA">
                    </div>
                </div>
            </div>
        </div>

        <div class="bracket-controls">
            <button class="control-btn" onclick="goToSetup()">BACK</button>
            <button class="control-btn primary" id="btn-populate" onclick="populateBracket()">POPULATE TEAMS</button>
            <button class="control-btn danger" id="btn-clear-bracket" onclick="clearBracket()">CLEAR</button>
        </div>
    </div>

    <!-- HOST SCREEN -->
    <div id="host" class="screen hidden">
        <!-- WINNER OVERLAY -->
        <div id="winner-overlay" class="hidden">
            <div id="winner-trophy" class="trophy-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                    stroke-linejoin="round" style="width:100%; height:100%;">
                    <path d="M6 9C6 9 6.5 17 12 17C17.5 17 18 9 18 9"></path>
                    <path d="M6 9H18"></path>
                    <path d="M6 9C3 9 2 6 2 4C2 2 4 2 6 2H18C20 2 22 2 22 4C22 6 21 9 18 9"></path>
                    <path d="M12 17V22"></path>
                    <path d="M8 22H16"></path>
                    <circle cx="12" cy="7" r="2"></circle>

        // --- BRACKET LOGIC ---
        function showBracket() {

        function populateBracket() {
            if (!isHost) return;
            // Shuffle a copy of the teams array to "mix things up"
            const shuffled = [...teams].sort(() => Math.random() - 0.5);

            // Assign shuffled teams to slots (7 Teams)
            const defaults = {
                'b-q1-a': shuffled[0].name, 'b-q1-b': shuffled[1].name,

                'b-f1-a': "", 'b-f1-b': "",
                'b-winner': ""
            };

            // Update DOM inputs immediately
            for (const [key, val] of Object.entries(defaults)) {
                const input = document.getElementById(key);
                if (input) input.value = val;
            }

            // Sync to Firebase
            const updates = {};
            for (const [key, val] of Object.entries(defaults)) {
                updates[`bracket/${key}`] = val;

        function clearBracket() {
            if (!isHost) return;

            inputs.forEach(i => i.value = "");
        }

        // Expose to window for HTML buttons
        window.clearBracket = clearBracket;
        window.populateBracket = populateBracket;
        window.saveBracket = saveBracket;
