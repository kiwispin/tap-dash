<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Dash: School Edition</title>
    <!-- Import Futuristic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- NEON THEME VARIABLES --- */
        :root {
            --bg-color: #050510;
            --text-main: #fff;
            
            /* NEON PALETTE */
            --cyan: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.3);
            --cyan-glow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            
            /* NEW SCHOOL COLORS */
            --pink: #ff00cc; 
            --yellow: #fff01f; 
            --orange: #ffaa00; 
            --green: #39ff14; 
            --blue: #00f3ff; 
        }

        /* --- GLOBAL & ANIMATION --- */
        body { 
            font-family: 'Orbitron', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--bg-color);
            color: var(--text-main); 
            touch-action: manipulation; 
        }

        /* Moving Grid Background */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            perspective: 500px;
            transform-style: preserve-3d;
        }
        .grid-bg::after {
            content: '';
            position: absolute;
            top: 20%; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(5,5,16,1) 0%, rgba(5,5,16,0) 20%);
        }

        .hidden { display: none !important; }
        .screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* --- BUTTON STYLES --- */
        button { cursor: pointer; transition: all 0.2s ease-out; font-family: 'Orbitron', sans-serif; }
        
        /* Team Selection Buttons */
        .btn-grid button { 
            position: relative;
            flex: 1 1 200px; max-width: 320px; height: 100px;
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 1.4rem; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; color: #fff;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 92% 100%, 0 100%);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .btn-grid button:hover { transform: translateY(-5px) scale(1.02); z-index: 10; }
        .btn-grid button.disabled-team {
            opacity: 0.2; pointer-events: none; filter: grayscale(1);
            border-color: #444; background: rgba(0,0,0,0.5);
        }

        .btn-aranui { border-color: var(--pink); background: rgba(255, 0, 204, 0.2) !important; box-shadow: 0 0 15px rgba(255, 0, 204, 0.2), inset 0 0 20px rgba(255, 0, 204, 0.1); }
        .btn-aranui:hover { background: var(--pink) !important; color: #fff; box-shadow: 0 0 40px var(--pink); }

        .btn-tainui { border-color: var(--yellow); background: rgba(255, 240, 31, 0.2) !important; box-shadow: 0 0 15px rgba(255, 240, 31, 0.2), inset 0 0 20px rgba(255, 240, 31, 0.1); color: #fff; }
        .btn-tainui:hover { background: var(--yellow) !important; color: #000; box-shadow: 0 0 40px var(--yellow); }

        .btn-mahitahi { border-color: var(--orange); background: rgba(255, 170, 0, 0.2) !important; box-shadow: 0 0 15px rgba(255, 170, 0, 0.2), inset 0 0 20px rgba(255, 170, 0, 0.1); }
        .btn-mahitahi:hover { background: var(--orange) !important; color: #fff; box-shadow: 0 0 40px var(--orange); }

        .btn-kiakaha { border-color: var(--green); background: rgba(57, 255, 20, 0.2) !important; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2), inset 0 0 20px rgba(57, 255, 20, 0.1); }
        .btn-kiakaha:hover { background: var(--green) !important; color: #000; box-shadow: 0 0 40px var(--green); }

        .btn-tearoha { border-color: var(--blue); background: rgba(0, 243, 255, 0.2) !important; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1); }
        .btn-tearoha:hover { background: var(--blue) !important; color: #000; box-shadow: 0 0 40px var(--blue); }

        /* --- SETUP SCREEN --- */
        #setup h1 { 
            font-size: 3rem; text-transform: uppercase; letter-spacing: 8px; 
            text-shadow: 0 0 30px var(--blue); margin-bottom: 30px;
            text-align: center; font-weight: 900;
        }
        .btn-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; 
            width: 95%; max-width: 1000px; padding: 0 20px;
        }
        .btn-host { 
            flex-basis: 100%; max-width: 500px; margin-top: 30px; height: 70px;
            background: #fff; color: #000; border: none; border-left: none;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px);
            font-weight: 900; letter-spacing: 4px; font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .btn-host:hover { 
            background: #fff; box-shadow: 0 0 50px rgba(255,255,255,0.6); 
            transform: scale(1.05); text-shadow: none;
        }
        
        /* HUD Style Bracket Button */
        .btn-bracket-corner {
            position: absolute; top: 30px; right: 30px;
            width: auto; height: auto; flex: none;
            padding: 10px 25px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--blue);
            color: var(--blue);
            font-family: 'Orbitron'; font-weight: 700; letter-spacing: 2px; font-size: 0.8rem;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(4px);
            z-index: 100;
        }
        .btn-bracket-corner:hover { 
            background: var(--blue); color: #000; 
            box-shadow: 0 0 30px var(--blue); 
            transform: translateY(0) scale(1.05);
        }

        /* --- BRACKET SCREEN (REMASTERED) --- */
        #bracket-screen {
            background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
            display: flex; flex-direction: column; padding: 20px;
            overflow: hidden; /* Prevent scrolling for cleaner look */
        }
        
        .bracket-container {
            display: flex; justify-content: center; align-items: stretch;
            width: 100%; height: 80vh; max-width: 1400px; margin: 0 auto;
            padding: 20px; box-sizing: border-box;
        }
        
        .column {
            display: flex; flex-direction: column; justify-content: space-around;
            flex: 1; position: relative;
        }
        
        .match-pair {
            display: flex; flex-direction: column; gap: 20px;
            position: relative;
            justify-content: center;
            height: 50%; /* Takes up half the column height */
        }
        
        /* The Bracket Connector Lines */
        .match-pair::after {
            content: ''; position: absolute;
            top: 25%; bottom: 25%; right: -20px;
            width: 20px; 
            border-right: 2px solid var(--cyan);
            border-top: 2px solid var(--cyan);
            border-bottom: 2px solid var(--cyan);
            box-shadow: 2px 0 10px var(--cyan); /* Neon Glow */
            pointer-events: none;
        }
        
        /* Connector from Semi to Final */
        .column-semi .match-pair { height: 100%; } /* One pair takes full height */
        .column-semi .match-pair::after { top: 25%; bottom: 25%; }

        .column-final { justify-content: center; align-items: center; }
        /* Line entering Final */
        .column-final::before {
            content: ''; position: absolute; left: -20px; top: 50%;
            width: 20px; height: 2px; background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .match-box {
            background: rgba(0, 10, 20, 0.9); 
            border: 1px solid var(--cyan-dim);
            padding: 5px; margin: 5px 0;
            display: flex; flex-direction: column; gap: 2px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);
            z-index: 2;
        }
        
        .bracket-input {
            background: transparent; border: 1px solid transparent; 
            color: #fff; text-transform: uppercase;
            font-family: 'Orbitron'; font-size: 1rem; font-weight: bold;
            padding: 8px; width: 100%; box-sizing: border-box;
            text-align: center; 
            transition: all 0.2s;
        }
        .bracket-input:hover { background: rgba(0, 243, 255, 0.1); border-color: var(--cyan-dim); }
        .bracket-input:focus { 
            background: rgba(0, 243, 255, 0.2); 
            outline: none; 
            border-color: var(--cyan); 
            box-shadow: 0 0 15px var(--cyan);
        }
        .bracket-input::placeholder { color: #444; font-weight: normal; }
        
        .bracket-header { 
            text-align: center; color: var(--cyan); 
            font-size: 1.2rem; margin-bottom: 10px; letter-spacing: 4px;
            text-shadow: 0 0 10px var(--cyan);
            font-weight: 900;
        }
        
        .champion-box {
            border: 2px solid var(--yellow);
            box-shadow: 0 0 30px var(--yellow), inset 0 0 20px rgba(255,240,31,0.2);
            transform: scale(1.2);
        }
        .champion-input { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); font-size: 1.2rem; }

        .bracket-controls {
            display: flex; gap: 20px; justify-content: center; width: 100%; margin-top: 10px;
        }

        /* --- HOST SCREEN --- */
        #host { 
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); 
            padding: 20px; box-sizing: border-box; 
            justify-content: flex-start; 
            overflow-y: auto; 
        }

        /* Match Setup Panel */
        #match-setup {
            width: 90%; max-width: 900px;
            background: rgba(0,0,0,0.6); border: 1px solid #444;
            padding: 8px 15px; border-radius: 8px; 
            display: flex; gap: 15px; font-size: 0.8rem;
            justify-content: center; flex-wrap: wrap;
            margin-bottom: 20px; 
        }
        .setup-checkbox { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #aaa; font-weight: bold; }
        .setup-checkbox:hover { color: #fff; }
        .setup-checkbox input { accent-color: var(--blue); width: 1.2em; height: 1.2em; }
        
        /* HUD Elements - RACE LIGHTS F1 STYLE */
        #race-lights {
            display: flex; gap: 20px; margin-bottom: 10px;
            background: rgba(0,0,0,0.8); padding: 10px 30px;
            border: 1px solid #333; border-radius: 50px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .light {
            width: 30px; height: 30px; border-radius: 50%;
            background: #151515; border: 2px solid #333;
            transition: all 0.05s;
        }
        .light.active { background: #ff0000; box-shadow: 0 0 30px #ff0000; border-color: #fff; }
        #race-lights.go-signal .light { background: #00ff00 !important; box-shadow: 0 0 50px #00ff00 !important; border-color: #fff; transform: scale(1.1); }

        .host-header { 
            display: flex; justify-content: space-between; width: 100%; align-items: center; 
            border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;
        }
        h1.host-title { margin: 0; font-size: 1.2rem; letter-spacing: 2px; color: #888; }
        #timer-display { 
            font-size: 5rem; font-weight: 900; line-height: 1; 
            text-shadow: 0 0 20px currentColor; font-variant-numeric: tabular-nums;
        }

        /* TRACKS */
        #scoreboard { width: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
        .lane { display: flex; align-items: center; gap: 20px; height: 18%; position: relative; transition: opacity 0.3s; }
        .lane.inactive { display: none; } 
        
        .lane-info { width: 140px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .lane-label { font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .win-dots { display: flex; gap: 5px; margin-top: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; border: 1px solid #555; }
        .dot.active { background: #fff; box-shadow: 0 0 10px #fff; }
        
        .track { 
            flex-grow: 1; background: rgba(255,255,255,0.05); height: 16px; 
            border-radius: 2px; position: relative; overflow: visible; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bar { 
            height: 100%; width: 0%; 
            transition: width 0.3s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            position: relative; box-shadow: 0 0 15px currentColor; 
        }
        .bar::after { 
            content: ''; position: absolute; top: -6px; right: -10px; 
            width: 24px; height: 28px; background: #fff; 
            border-radius: 2px; box-shadow: 0 0 10px #fff, 0 0 40px currentColor;
            transform: skewX(-20deg);
        }
        .score-text { position: absolute; right: -80px; top: -5px; font-size: 1.5rem; width: 60px; color: #fff; opacity: 0.8; }

        /* CONTROLS */
        #controls { 
            height: 80px; display: flex; gap: 20px; align-items: center; justify-content: center;
            width: 100%; background: rgba(0,0,0,0.8); padding: 0 20px; border-top: 1px solid #333; box-sizing: border-box;
        }
        .status-badge, .control-btn {
            height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 4px; box-sizing: border-box;
        }
        .status-badge { background: #111; color: #555; border: 1px solid #333; min-width: 180px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); padding: 0 20px; }
        .status-badge.active { background: rgba(0, 255, 0, 0.1); color: var(--green); border-color: var(--green); box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); text-shadow: 0 0 5px var(--green); }
        .control-btn { background: transparent; color: #888; border: 1px solid #444; padding: 0 30px; cursor: pointer; transition: all 0.2s; min-width: 200px; font-family: 'Orbitron'; }
        .control-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }
        .control-btn.primary { border-color: var(--blue); color: var(--blue); box-shadow: inset 0 0 10px rgba(0,243,255,0.1); }
        .control-btn.primary:hover { background: var(--blue); color: #000; box-shadow: 0 0 20px var(--blue); }
        .control-btn.danger { border-color: var(--pink); color: var(--pink); opacity: 0.7; }
        .control-btn.danger:hover { opacity: 1; background: var(--pink); color: white; box-shadow: 0 0 20px var(--pink); }

        /* --- WINNER OVERLAY --- */
        #winner-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); animation: fadeIn 0.5s ease-out;
        }
        .trophy-container { width: 200px; height: 200px; margin-bottom: 30px; filter: drop-shadow(0 0 20px currentColor); animation: float 2s infinite ease-in-out; }
        .winner-title { font-size: 3rem; color: #fff; text-shadow: 0 0 10px #fff; margin: 0; letter-spacing: 5px; }
        .winner-name { font-size: 5rem; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 30px currentColor, 0 0 60px currentColor; margin: 10px 0 40px 0; letter-spacing: 3px; }
        .winner-close-btn { background: transparent; color: #fff; border: 2px solid #fff; padding: 15px 40px; font-family: 'Orbitron'; font-size: 1.2rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px; }
        .winner-close-btn:hover { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* --- CLIENT SCREEN --- */
        #client { text-align: center; position: relative; background: radial-gradient(circle, #222 0%, #000 100%); }
        #tap-btn { 
            width: 70vw; height: 70vw; max-width: 350px; max-height: 350px; 
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5); color: white; 
            font-size: 3rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.8);
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; position: relative; z-index: 2;
        }
        #tap-btn::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border-radius: 50%; border: 4px solid currentColor; opacity: 0.5; box-shadow: 0 0 20px currentColor; animation: pulse 2s infinite; }
        #tap-btn:active { transform: scale(0.96); }
        #tap-btn:active::after { opacity: 1; box-shadow: 0 0 50px currentColor; }
        #client.locked { background: #000 !important; }
        #client.locked #tap-btn { opacity: 0.1; pointer-events: none; filter: grayscale(1); }
        #msg { font-size: 3rem; margin-bottom: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px currentColor; z-index: 2; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.02); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <!-- SETUP SCREEN -->
    <div id="setup" class="screen">
        <button class="btn-bracket-corner" onclick="showBracket()">TOURNAMENT BRACKET</button>
        
        <h1>Select Team</h1>
        <div class="btn-grid">
            <button id="btn-select-aranui" class="btn-aranui" onclick="joinGame('aranui')">Aranui</button>
            <button id="btn-select-tainui" class="btn-tainui" onclick="joinGame('tainui')">Tainui</button>
            <button id="btn-select-mahitahi" class="btn-mahitahi" onclick="joinGame('mahitahi')">Mahi Tahi</button>
            <button id="btn-select-kiakaha" class="btn-kiakaha" onclick="joinGame('kiakaha')">Kia Kaha</button>
            <button id="btn-select-tearoha" class="btn-tearoha" onclick="joinGame('tearoha')">Te Aroha</button>
            <button class="btn-host" onclick="initHost()">INITIATE HOST SYSTEM</button>
        </div>
    </div>

    <!-- BRACKET SCREEN (REMASTERED) -->
    <div id="bracket-screen" class="screen hidden">
        <h1 class="bracket-header" style="font-size: 2.5rem; color: #fff; text-shadow: 0 0 20px var(--cyan);">TOURNAMENT TREE</h1>
        
        <div class="bracket-container">
            <!-- Round 1 (Quarter Finals) -->
            <div class="column">
                <div class="bracket-header">QTR</div>
                
                <div class="match-pair">
                    <div class="match-box">
                        <input class="bracket-input" id="b-q1-a" onchange="saveBracket(this.id, this.value)" placeholder="TEAM 1">
                        <input class="bracket-input" id="b-q1-b" onchange="saveBracket(this.id, this.value)" placeholder="TEAM 2">
                    </div>
                    <div class="match-box">
                        <input class="bracket-input" id="b-q2-a" onchange="saveBracket(this.id, this.value)" placeholder="TEAM 3">
                        <input class="bracket-input" id="b-q2-b" onchange="saveBracket(this.id, this.value)" placeholder="TEAM 4">
                    </div>
                </div>

                <div class="match-pair">
                    <div class="match-box">
                        <input class="bracket-input" id="b-q3-a" onchange="saveBracket(this.id, this.value)" placeholder="TEAM 5">
                        <input class="bracket-input" id="b-q3-b" onchange="saveBracket(this.id, this.value)" placeholder="BYE">
                    </div>
                    <div class="match-box">
                        <input class="bracket-input" id="b-q4-a" onchange="saveBracket(this.id, this.value)" placeholder="BYE">
                        <input class="bracket-input" id="b-q4-b" onchange="saveBracket(this.id, this.value)" placeholder="BYE">
                    </div>
                </div>
            </div>

            <!-- Round 2 (Semi Finals) -->
            <div class="column column-semi">
                <div class="bracket-header">SEMI</div>
                
                <div class="match-pair">
                    <div class="match-box">
                        <input class="bracket-input" id="b-s1-a" onchange="saveBracket(this.id, this.value)" placeholder="WINNER Q1/Q2">
                        <input class="bracket-input" id="b-s1-b" onchange="saveBracket(this.id, this.value)" placeholder="WINNER Q3/Q4">
                    </div>
                </div>
            </div>

            <!-- Round 3 (Final) -->
            <div class="column column-final">
                <div class="bracket-header">FINAL</div>
                
                <div class="match-box champion-box">
                    <input class="bracket-input champion-input" id="b-winner" onchange="saveBracket(this.id, this.value)" placeholder="CHAMPION">
                </div>
            </div>
        </div>

        <div class="bracket-controls">
            <button class="control-btn" onclick="goToSetup()">BACK</button>
            <button class="control-btn primary" onclick="populateBracket()">POPULATE TEAMS</button>
            <button class="control-btn danger" onclick="clearBracket()">CLEAR</button>
        </div>
    </div>

    <!-- HOST SCREEN -->
    <div id="host" class="screen hidden">
        <!-- WINNER OVERLAY -->
        <div id="winner-overlay" class="hidden">
            <div id="winner-trophy" class="trophy-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:100%; height:100%;">
                    <path d="M6 9C6 9 6.5 17 12 17C17.5 17 18 9 18 9"></path>
                    <path d="M6 9H18"></path>
                    <path d="M6 9C3 9 2 6 2 4C2 2 4 2 6 2H18C20 2 22 2 22 4C22 6 21 9 18 9"></path>
                    <path d="M12 17V22"></path>
                    <path d="M8 22H16"></path>
                    <circle cx="12" cy="7" r="2"></circle>
                </svg>
            </div>
            <h2 id="winner-title-text" class="winner-title">ROUND WINNER</h2>
            <h1 id="winner-name-text" class="winner-name">TEAM NAME</h1>
            <button class="winner-close-btn" onclick="closeWinner()">CONTINUE</button>
        </div>

        <!-- Match Setup Panel -->
        <div id="match-setup">
            <span>ACTIVE TEAMS:</span>
            <label class="setup-checkbox"><input type="checkbox" id="chk-aranui" checked onchange="updateActiveTeams()" /> Aranui</label>
            <label class="setup-checkbox"><input type="checkbox" id="chk-tainui" checked onchange="updateActiveTeams()" /> Tainui</label>
            <label class="setup-checkbox"><input type="checkbox" id="chk-mahitahi" checked onchange="updateActiveTeams()" /> Mahi Tahi</label>
            <label class="setup-checkbox"><input type="checkbox" id="chk-kiakaha" checked onchange="updateActiveTeams()" /> Kia Kaha</label>
            <label class="setup-checkbox"><input type="checkbox" id="chk-tearoha" checked onchange="updateActiveTeams()" /> Te Aroha</label>
        </div>

        <div id="race-lights">
            <div class="light" id="light-1"></div>
            <div class="light" id="light-2"></div>
            <div class="light" id="light-3"></div>
            <div class="light" id="light-4"></div>
            <div class="light" id="light-5"></div>
        </div>

        <div class="host-header">
            <h1 class="host-title">TOURNAMENT BRACKET</h1>
            <div id="timer-display" style="color: #fff">15</div>
        </div>
        
        <div id="scoreboard"></div>
        
        <div id="controls">
            <div id="host-status" class="status-badge">SYSTEM IDLE</div>
            <button onclick="startSequence()" class="control-btn primary">ENGAGE (Space)</button>
            <button onclick="resetScores()" class="control-btn">RESET SCORES (R)</button>
            <button onclick="resetMatch()" class="control-btn danger">NEW MATCH</button>
        </div>
    </div>

    <!-- CLIENT SCREEN -->
    <div id="client" class="screen hidden">
        <div id="msg">WAITING</div>
        <div id="tap-btn">TAP</div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_HERE",
            authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "PASTE_PROJECT_ID",
            storageBucket: "PASTE_PROJECT_ID.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- GLOBAL DATA ---
        let myTeam = null;
        let isHost = false;
        
        const teams = [
            { id: 'aranui', name: 'Aranui', color: 'pink' },
            { id: 'tainui', name: 'Tainui', color: 'yellow' },
            { id: 'mahitahi', name: 'Mahi Tahi', color: 'orange' },
            { id: 'kiakaha', name: 'Kia Kaha', color: 'green' },
            { id: 'tearoha', name: 'Te Aroha', color: 'blue' }
        ];

        const currentScores = { aranui: 0, tainui: 0, mahitahi: 0, kiakaha: 0, tearoha: 0 };
        const teamWins = { aranui: 0, tainui: 0, mahitahi: 0, kiakaha: 0, tearoha: 0 };
        const winningScore = 300; 
        
        let gameInterval, countdownInterval;
        let isSequenceRunning = false; 
        const ROUND_DURATION = 15;
        let audioCtx;
        let pendingTaps = 0;

        // --- LISTENERS FOR SETUP SCREEN ---
        db.ref('game/activeTeams').on('value', snap => {
            const activeTeams = snap.val();
            if (!activeTeams) return; 
            teams.forEach(t => {
                const btn = document.getElementById(`btn-select-${t.id}`);
                if (btn) {
                    if (activeTeams[t.id]) btn.classList.remove('disabled-team');
                    else btn.classList.add('disabled-team');
                }
            });
        });

        // --- BRACKET LOGIC ---
        function showBracket() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('host').classList.add('hidden');
            document.getElementById('bracket-screen').classList.remove('hidden');
            
            // Listen for changes
            db.ref('bracket').on('value', snap => {
                const data = snap.val() || {};
                for (const [key, val] of Object.entries(data)) {
                    const input = document.getElementById(key);
                    if (input) input.value = val;
                }
            });
        }

        function goToSetup() {
            document.getElementById('bracket-screen').classList.add('hidden');
            document.getElementById('setup').classList.remove('hidden');
        }

        function saveBracket(id, val) {
            db.ref(`bracket/${id}`).set(val);
        }

        function populateBracket() {
            if(!confirm("Populate with default teams? Overwrites current bracket.")) return;
            
            // Instant Visual Update (Optimistic UI)
            const defaults = {
                'b-q1-a': "Aranui", 'b-q1-b': "Tainui",
                'b-q2-a': "Mahi Tahi", 'b-q2-b': "Kia Kaha",
                'b-q3-a': "Te Aroha", 'b-q3-b': "BYE",
                'b-q4-a': "BYE", 'b-q4-b': "BYE",
                'b-s1-a': "", 'b-s1-b': "",
                'b-s2-a': "Te Aroha", 'b-s2-b': "", // Te Aroha advances on bye
                'b-f1-a': "", 'b-f1-b': "",
                'b-winner': ""
            };

            // Update DOM inputs immediately
            for (const [key, val] of Object.entries(defaults)) {
                const input = document.getElementById(key);
                if(input) input.value = val;
            }

            // Sync to Firebase
            const updates = {};
            for (const [key, val] of Object.entries(defaults)) {
                updates[`bracket/${key}`] = val;
            }
            db.ref().update(updates);
        }

        function clearBracket() {
            if(!confirm("Clear entire bracket?")) return;
            db.ref('bracket').set(null);
            const inputs = document.querySelectorAll('.bracket-input');
            inputs.forEach(i => i.value = "");
        }

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(type, val) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'count') {
                osc.type = 'sawtooth';
                const num = val || 5; 
                const step = 5 - num;
                const freq = 220 + (step * 55);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'go') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const oscW = audioCtx.createOscillator();
                    const gainW = audioCtx.createGain();
                    oscW.connect(gainW);
                    gainW.connect(audioCtx.destination);
                    oscW.type = 'triangle';
                    oscW.frequency.value = freq;
                    gainW.gain.setValueAtTime(0, now + (i*0.1));
                    gainW.gain.linearRampToValueAtTime(0.3, now + (i*0.1) + 0.05);
                    gainW.gain.exponentialRampToValueAtTime(0.001, now + (i*0.1) + 0.4);
                    oscW.start(now + (i*0.1));
                    oscW.stop(now + (i*0.1) + 0.5);
                });
            }
        }

        // --- CLIENT FUNCTIONS ---
        function joinGame(teamId) {
            const btn = document.getElementById(`btn-select-${teamId}`);
            if (btn && btn.classList.contains('disabled-team')) return;

            myTeam = teamId;
            document.getElementById('setup').classList.add('hidden');
            const clientScreen = document.getElementById('client');
            clientScreen.classList.remove('hidden');
            
            const teamObj = teams.find(t => t.id === teamId);
            const colorVar = `var(--${teamObj.color})`;
            
            const btnTap = document.getElementById('tap-btn');
            const msg = document.getElementById('msg');
            btnTap.style.color = colorVar;
            msg.style.color = colorVar;

            db.ref('game/status').on('value', snap => {
                const status = snap.val();
                if (status === 'playing') {
                    clientScreen.classList.remove('locked');
                    msg.innerText = "ENGAGED";
                    if (navigator.vibrate) navigator.vibrate(50);
                } else {
                    clientScreen.classList.add('locked');
                    msg.innerText = "STANDBY"; 
                }
            });

            const eventType = 'ontouchstart' in window ? 'touchstart' : 'click';
            btnTap.addEventListener(eventType, (e) => {
                e.preventDefault(); 
                handleTap();
            });
            
            setInterval(flushPendingTaps, 300); 
        }

        function handleTap() {
            if (document.getElementById('client').classList.contains('locked')) return;
            pendingTaps++;
            const btn = document.getElementById('tap-btn');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 50);
        }
        
        function flushPendingTaps() {
            if (pendingTaps > 0) {
                const countToSend = pendingTaps;
                pendingTaps = 0; 
                const teamRef = db.ref(`scores/${myTeam}`);
                teamRef.transaction(currentScore => { return (currentScore || 0) + countToSend; });
            }
        }

        // --- HOST FUNCTIONS ---
        function initHost() {
            isHost = true;
            initAudio();
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('host').classList.remove('hidden');

            const board = document.getElementById('scoreboard');
            teams.forEach(t => {
                board.innerHTML += `
                    <div class="lane" id="lane-${t.id}">
                        <div class="lane-info">
                            <div class="lane-label text-${t.id}">${t.name}</div>
                            <div class="win-dots" id="dots-${t.id}">
                                <div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div>
                            </div>
                        </div>
                        <div class="track">
                            <div id="bar-${t.id}" class="bar bg-${t.id}"></div>
                            <div id="score-${t.id}" class="score-text">0</div>
                        </div>
                    </div>
                `;
            });

            updateActiveTeams();

            teams.forEach(t => {
                db.ref(`scores/${t.id}`).on('value', snap => {
                    const score = snap.val() || 0;
                    currentScores[t.id] = score; 
                    const percent = Math.min((score / winningScore) * 100, 100);
                    document.getElementById(`bar-${t.id}`).style.width = `${percent}%`;
                    document.getElementById(`score-${t.id}`).innerText = score;
                });
            });

            db.ref('game/status').on('value', snap => {
                const status = snap.val();
                const badge = document.getElementById('host-status');
                if (status === 'playing') {
                    badge.innerText = "SYSTEM ACTIVE";
                    badge.classList.add('active');
                } else {
                    badge.innerText = "SYSTEM IDLE";
                    badge.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.repeat) return; 
                if (e.code === 'Space') startSequence();
                if (e.code === 'KeyR') resetScores();
            });
        }

        function updateActiveTeams() {
            if (!isHost) return;
            const updates = {};
            teams.forEach(t => {
                const isChecked = document.getElementById(`chk-${t.id}`).checked;
                updates[`game/activeTeams/${t.id}`] = isChecked;
                const lane = document.getElementById(`lane-${t.id}`);
                if (lane) {
                    if (isChecked) lane.classList.remove('inactive');
                    else lane.classList.add('inactive');
                }
            });
            db.ref().update(updates);
        }
        
        function determineWinner() {
            let maxScore = -1;
            let winningTeamId = null;
            teams.forEach(t => {
                const isChecked = document.getElementById(`chk-${t.id}`).checked;
                if (isChecked) {
                    const s = currentScores[t.id];
                    if (s > maxScore) { maxScore = s; winningTeamId = t.id; }
                }
            });

            if (winningTeamId && maxScore > 0) {
                teamWins[winningTeamId]++;
                updateDots(winningTeamId);
                const isMatchWin = teamWins[winningTeamId] >= 2;
                showWinnerOverlay(winningTeamId, isMatchWin);
            }
        }

        function updateDots(teamId) {
            const dotsContainer = document.getElementById(`dots-${teamId}`);
            if (!dotsContainer) return;
            const dots = dotsContainer.querySelectorAll('.dot');
            const wins = teamWins[teamId];
            for (let i = 0; i < dots.length; i++) {
                if (i < wins) dots[i].classList.add('active');
                else dots[i].classList.remove('active');
            }
        }

        function showWinnerOverlay(teamId, isMatchWin) {
            const team = teams.find(t => t.id === teamId);
            if (!team) return;
            const overlay = document.getElementById('winner-overlay');
            const titleText = document.getElementById('winner-title-text');
            const nameText = document.getElementById('winner-name-text');
            const trophy = document.getElementById('winner-trophy');

            if (isMatchWin) {
                titleText.innerText = "MATCH WINNER";
                titleText.style.color = "#fff"; 
            } else {
                titleText.innerText = "ROUND WINNER";
                titleText.style.color = "#888"; 
            }
            nameText.innerText = team.name;
            nameText.style.color = `var(--${team.color})`;
            trophy.style.color = `var(--${team.color})`; 
            playBeep('win');
            overlay.classList.remove('hidden');
        }

        function closeWinner() { document.getElementById('winner-overlay').classList.add('hidden'); }

        function setLights(state) {
            const lights = document.querySelectorAll('.light');
            const container = document.getElementById('race-lights');
            if (state === 0) {
                lights.forEach(l => l.classList.remove('active'));
                container.classList.remove('go-signal');
            } else if (state === -1) { container.classList.add('go-signal'); }
        }

        function startSequence() {
            if (!isHost || isSequenceRunning) return; 
            closeWinner();
            isSequenceRunning = true;
            setLights(0);
            let count = 5;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.style.color = 'var(--yellow)';
            runCountdownBeat(count);
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) runCountdownBeat(count);
                else { clearInterval(countdownInterval); startGameplay(); }
            }, 1000);
        }

        function runCountdownBeat(num) {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = num;
            playBeep('count', num);
            const lightIndex = 5 - num + 1; 
            const light = document.getElementById(`light-${lightIndex}`);
            if (light) light.classList.add('active');
        }

        function startGameplay() {
            let timeLeft = ROUND_DURATION;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.style.color = 'var(--green)';
            timerDisplay.innerText = "GO";
            setLights(-1); 
            playBeep('go');
            db.ref('game/status').set('playing');
            setTimeout(() => {
                timerDisplay.style.color = '#fff';
                timerDisplay.innerText = timeLeft;
                setLights(0); 
                gameInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if (timeLeft <= 0) { clearInterval(gameInterval); endRound(); }
                }, 1000);
            }, 1000);
        }

        function endRound() {
            db.ref('game/status').set('paused');
            isSequenceRunning = false; 
            document.getElementById('timer-display').style.color = '#555'; 
            document.getElementById('timer-display').innerText = "0";
            determineWinner();
        }

        function resetScores() {
            if(!isHost) return;
            if(!confirm("Reset current scores? (Dots/Wins will remain)")) return;
            closeWinner();
            clearInterval(gameInterval);
            clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => updates[`scores/${t.id}`] = 0);
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }

        function resetMatch() {
            if(!isHost) return;
            if(!confirm("NEW MATCH? This will clear ALL scores and Win Dots.")) return;
            closeWinner();
            clearInterval(gameInterval);
            clearInterval(countdownInterval);
            isSequenceRunning = false;
            document.getElementById('timer-display').innerText = ROUND_DURATION;
            document.getElementById('timer-display').style.color = '#fff';
            setLights(0);
            const updates = {};
            teams.forEach(t => {
                updates[`scores/${t.id}`] = 0;
                teamWins[t.id] = 0;
                updateDots(t.id);
            });
            updates['game/status'] = 'paused';
            db.ref().update(updates);
        }
    </script>
</body>
</html>
